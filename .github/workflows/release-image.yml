name: Release Oiê image

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Published Oiê release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-oie-image
  queue: max

jobs:
  release:
    if: >-
      github.repository == 'araihu/oie' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/araihu/oie
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out the release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify published corresponding source
        id: source
        run: |
          set -euo pipefail
          python3 scripts/release_desktop.py validate "$VERSION"
          revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$VERSION" --jq .sha)
          name="oie_${VERSION}_linux_amd64_source.tar.gz"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/$name"
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")
          checksum=$(jq -er --arg name "$name" --arg url "$url" '
            select(.draft == false) | .assets[] |
            select(.name == $name and .state == "uploaded" and .browser_download_url == $url) |
            .digest | capture("^sha256:(?<hash>[a-f0-9]{64})$").hash
          ' <<< "$release")
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/packaging-receipt.json" |
            jq -e --arg version "$VERSION" --arg revision "$revision" --arg name "$name" --arg hash "$checksum" '
              .applicationSourceTag == $version and .applicationSourceRevision == $revision and
              any(.artifacts[]; .name == $name and .sha256 == $hash) and
              any(.verification[]; .sourceArchiveSHA256 == $hash and .status == "passed" and
                .serverTargets == ["linux/amd64", "linux/arm64"])
            '
          curl --fail --silent --show-error --location --retry 3 --head "$url" >/dev/null
          printf 'revision=%s\nurl=%s\nchecksum=%s\n' "$revision" "$url" "$checksum" >> "$GITHUB_OUTPUT"
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.revision }}
          path: release-source
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tagged version
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: release-source
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: |
            OIE_RELEASE_VERSION=${{ env.VERSION }}
            OIE_RELEASE_REVISION=${{ steps.source.outputs.revision }}
            OIE_SOURCE_URL=${{ steps.source.outputs.url }}
            OIE_SOURCE_SHA256=${{ steps.source.outputs.checksum }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=${{ env.VERSION }}
            com.araihu.oie.source.url=${{ steps.source.outputs.url }}
            com.araihu.oie.source.sha256=${{ steps.source.outputs.checksum }}
      - name: Verify both platforms and promote the newest version
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" |
            jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]'
          tags=$(python3 scripts/oie-release-tags.py)
          if [ "$VERSION" = "$(head -n 1 <<<"$tags")" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          fi
          printf 'Published `%s:%s` at `%s`\n' "$IMAGE" "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
