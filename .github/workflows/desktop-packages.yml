name: Desktop release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify the selected ref without publishing a release
        type: boolean
        default: false
      resume_tag:
        description: Existing release tag to publish from a previous build
        type: string
      resume_run:
        description: Desktop release workflow run ID with verified release-assets
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.resume_tag && format('refs/tags/{0}', inputs.resume_tag) || github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    permissions:
      actions: read
      contents: read
    if: >-
      github.repository == 'araihu/oie' &&
      (inputs.verify_only || (github.ref_type == 'tag' && github.event.deleted != true && github.event.forced != true) ||
       (github.ref == 'refs/heads/main' && inputs.resume_tag != '' && inputs.resume_run != ''))
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
      revision: ${{ steps.tag.outputs.revision }}
      resume: ${{ steps.tag.outputs.resume }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: tag
        env:
          VERIFY_ONLY: ${{ inputs.verify_only }}
          RESUME_TAG: ${{ inputs.resume_tag }}
          RESUME_RUN: ${{ inputs.resume_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$GITHUB_REF_NAME
          revision=$(git rev-parse HEAD)
          if [[ -n "$RESUME_TAG" || -n "$RESUME_RUN" ]]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$VERIFY_ONLY" = false
            [[ "$RESUME_RUN" =~ ^[0-9]+$ ]]
            version=$RESUME_TAG
            python3 scripts/release_desktop.py validate "$version"
            revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$version" --jq .sha)
            run="repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN"
            gh api "$run" | jq -e --arg version "$version" --arg revision "$revision" --arg repo "$GITHUB_REPOSITORY" '
              .path == ".github/workflows/desktop-packages.yml" and
              .head_repository.full_name == $repo and
              .head_branch == $version and .head_sha == $revision and
              .event == "push" and .status == "completed"
            '
            gh api "$run/jobs" | jq -e 'any(.jobs[]; .name == "packages" and .conclusion == "success")'
            echo "resume=$RESUME_RUN" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_TYPE" == branch && "$VERIFY_ONLY" == true ]]; then
            version=v0.0.0-check.${GITHUB_RUN_ID}
          fi
          python3 scripts/release_desktop.py validate "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  linux:
    needs: tag
    if: needs.tag.outputs.resume == ''
    runs-on: ubuntu-24.04
    env:
      OIE_RELEASE_VERSION: ${{ needs.tag.outputs.version }}
      OIE_CI_ARTIFACTS: dist/linux
      OIE_RELEASE_REVISION: ${{ needs.tag.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/ci/go.sum
      - name: Create a local tag for branch verification
        if: inputs.verify_only && github.ref_type == 'branch'
        run: git tag "$OIE_RELEASE_VERSION" "$OIE_RELEASE_REVISION"
      - run: make package-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: dist/linux
          if-no-files-found: error
          compression-level: 0

  macos:
    needs: tag
    if: needs.tag.outputs.resume == ''
    runs-on: macos-15
    env:
      OIE_RELEASE_VERSION: ${{ needs.tag.outputs.version }}
      OIE_RELEASE_REVISION: ${{ needs.tag.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cli/go.sum
            tools/go.sum
      - name: Create a local tag for branch verification
        if: inputs.verify_only && github.ref_type == 'branch'
        run: git tag "$OIE_RELEASE_VERSION" "$OIE_RELEASE_REVISION"
      - name: Build the application bundle and its corresponding source
        run: |
          sh scripts/package-desktop.sh --version "$OIE_RELEASE_VERSION" \
            --revision "$OIE_RELEASE_REVISION" --source "$PWD" --output "$RUNNER_TEMP/macos"
      - name: Verify the source rebuild and installed application
        run: |
          output="$RUNNER_TEMP/macos"
          prefix="oie_${OIE_RELEASE_VERSION}_darwin_arm64"
          python3 scripts/verify-source-package.py "$output/${prefix}_source.tar.gz" \
            "$OIE_RELEASE_VERSION" "$OIE_RELEASE_REVISION" "$output/source-verification.json"
          python3 tests/packaging/smoke_macos.py --archive "$output/$prefix.tar.gz" \
            --installer scripts/install.sh --version "$OIE_RELEASE_VERSION" \
            --revision "$OIE_RELEASE_REVISION" --artifacts "$output/runtime"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-desktop
          path: ${{ runner.temp }}/macos
          if-no-files-found: error
          compression-level: 0

  packages:
    needs: [tag, linux, macos]
    runs-on: ubuntu-24.04
    env:
      OIE_RELEASE_VERSION: ${{ needs.tag.outputs.version }}
      OIE_RELEASE_REVISION: ${{ needs.tag.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-desktop'
          path: dist/builds
      - name: Build native packages and Homebrew recipes
        run: |
          python3 scripts/release_desktop.py assemble --version "$OIE_RELEASE_VERSION" \
            --revision "$OIE_RELEASE_REVISION" --linux dist/builds/linux-desktop/release \
            --linux-report dist/builds/linux-desktop/runtime/report.json \
            --macos dist/builds/macos-desktop --macos-report dist/builds/macos-desktop/runtime/report.json \
            --output dist/release
          GOBIN="$RUNNER_TEMP" GOWORK=off go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0
          python3 scripts/package-distribution.py --version "$OIE_RELEASE_VERSION" \
            --assets dist/release --output dist/packages --nfpm "$RUNNER_TEMP/nfpm"
      - name: Build Flatpak bundle from the verified Linux archive
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils
          # Ubuntu's hosted VM restricts unprivileged namespaces by default.
          # Flatpak uses them to isolate the build.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          appstreamcli validate --no-net dist/packages/flatpak/org.araihu.oie.metainfo.xml
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

          archive="oie_${OIE_RELEASE_VERSION}_linux_amd64.tar.gz"
          hash=$(sha256sum "dist/release/$archive" | cut -d ' ' -f 1)
          mkdir -p "dist/flatpak-sources/downloads/$hash"
          cp "dist/release/$archive" "dist/flatpak-sources/downloads/$hash/"
          flatpak-builder --user --install-deps-from=flathub --assumeyes --disable-rofiles-fuse \
            --disable-download --extra-sources="$PWD/dist/flatpak-sources" \
            --state-dir=dist/flatpak-state --repo=dist/flatpak-repo \
            dist/flatpak-build dist/packages/flatpak/org.araihu.oie.json
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            dist/flatpak-repo "dist/release/oie-$OIE_RELEASE_VERSION-x86_64.flatpak" org.araihu.oie
      - name: Assemble the release assets
        run: |
          cp dist/packages/native/* dist/release/
          tar -czf "dist/release/oie-$OIE_RELEASE_VERSION-homebrew.tar.gz" -C dist/packages/homebrew Casks Formula
          python3 scripts/release_desktop.py checksums dist/release --release-version "$OIE_RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release
          if-no-files-found: error
          compression-level: 0

  publish:
    if: >-
      !cancelled() && needs.tag.result == 'success' &&
      (needs.tag.outputs.resume != '' ||
       (github.ref_type == 'tag' && !inputs.verify_only && needs.packages.result == 'success'))
    needs: [tag, packages]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OIE_RELEASE_VERSION: ${{ needs.tag.outputs.version }}
      OIE_RELEASE_REVISION: ${{ needs.tag.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: needs.tag.outputs.resume == ''
        with:
          name: release-assets
          path: dist/release
      - uses: actions/download-artifact@v4
        if: needs.tag.outputs.resume != ''
        with:
          name: release-assets
          path: dist/release
          github-token: ${{ github.token }}
          run-id: ${{ needs.tag.outputs.resume }}
      - name: Normalize package filenames from the previous build
        if: needs.tag.outputs.resume != ''
        run: |
          python3 scripts/release_desktop.py verify-assets "$OIE_RELEASE_VERSION" "$OIE_RELEASE_REVISION" dist/release
          python3 scripts/release_desktop.py checksums dist/release --release-version "$OIE_RELEASE_VERSION"
      - run: bash scripts/publish-desktop-release.sh "$OIE_RELEASE_VERSION" dist/release "$OIE_RELEASE_REVISION"
  publish-apt:
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    needs: [tag, publish]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      # Pages can keep serving an earlier deployment when a tag reuses its SHA.
      # Dispatch on the default branch from CI to deploy outside the tag event.
      - name: Start APT publication on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ needs.tag.outputs.version }}
        run: |
          gh workflow run publish-apt.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            --raw-field release_tag="$RELEASE_TAG" --raw-field desktop_run="$GITHUB_RUN_ID"
