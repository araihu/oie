name: Engine checks
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      full_browser_matrix:
        description: Run every browser presentation variant
        type: boolean
        default: false
concurrency:
  group: engine-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  dagger:
    name: Dagger (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [build, race, desktop, browser-consumer, browser-integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/ci/go.sum
      - run: sh tools/ci/run.sh "$MODE"
        env:
          MODE: ${{ matrix.mode }}
          OIE_CI_TIMEOUT: 35m
          OIE_CI_ARTIFACTS: ${{ runner.temp }}/oie-ci
          OIE_CI_BROWSER_FULL_MATRIX: ${{ inputs.full_browser_matrix && '1' || '0' }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dagger-ci-evidence-${{ matrix.mode }}
          path: ${{ runner.temp }}/oie-ci

  image-smoke:
    name: Container smoke test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the Oiê image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: oie:check
      - name: Verify the web interface, engine and persistent volume
        run: sh scripts/smoke-image.sh oie:check

  required:
    name: Required CI
    if: ${{ !cancelled() }}
    needs: [dagger, image-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs to pass
        env:
          DAGGER_RESULT: ${{ needs.dagger.result }}
          SMOKE_RESULT: ${{ needs.image-smoke.result }}
        run: |
          test "$DAGGER_RESULT" = success
          test "$SMOKE_RESULT" = success

  image-publish:
    name: Publish to GHCR
    if: >-
      github.repository == 'araihu/oie' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.full_browser_matrix))
    needs: image-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-oie-image
      queue: max
    env:
      IMAGE: ghcr.io/araihu/oie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the image for both platforms
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=oie-publish
          cache-to: type=gha,scope=oie-publish,mode=max
      - name: Update the main tag
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" |
            jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]'
          printf 'Published `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          main_revision=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$main_revision" = "$GITHUB_SHA" ]; then
            docker buildx imagetools create --tag "$IMAGE:main" "$IMAGE@$DIGEST"
            printf 'Updated `%s:main`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
          fi
