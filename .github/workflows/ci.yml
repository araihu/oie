name: Engine checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  dagger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/ci/go.sum
      - run: make ci
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dagger-ci-evidence
          path: tests/browser/artifacts/ci
