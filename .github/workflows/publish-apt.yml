name: Publish Arai Hû APT repository
run-name: Publish Arai Hû APT repository${{ inputs.release_tag && format(' for {0}', inputs.release_tag) || '' }}${{ inputs.desktop_run && format(' (desktop run {0})', inputs.desktop_run) || '' }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Desktop release tag that prompted the archive update
        type: string
      desktop_run:
        description: Desktop release workflow run ID
        type: string

permissions:
  contents: read

concurrency:
  group: oie-apt-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'araihu/oie' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    environment: apt-signing
    outputs:
      index_sha256: ${{ steps.proof.outputs.index_sha256 }}
      sources_sha256: ${{ steps.proof.outputs.sources_sha256 }}
      version: ${{ steps.proof.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      BOOTSTRAP_TAG: v0.0.1-rc.3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage published desktop packages
        id: stage
        run: |
          python3 scripts/stage_apt_releases.py dist/pages
          shopt -s nullglob
          packages=(dist/pages/apt/pool/main/o/oie/*.deb)
          if (( ${#packages[@]} < 3 )) &&
             [[ ! -e dist/pages/apt/pool/main/o/oie/oie_0.0.1~rc.3-1_amd64.deb ]]; then
            echo 'bootstrap=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.stage.outputs.bootstrap == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Package the bootstrap release
        if: steps.stage.outputs.bootstrap == 'true'
        run: |
          python3 scripts/release_desktop.py validate "$BOOTSTRAP_TAG"
          gh release view "$BOOTSTRAP_TAG" --repo araihu/oie --json isDraft --jq .isDraft | grep -qx false
          gh release download "$BOOTSTRAP_TAG" --repo araihu/oie --dir dist/bootstrap \
            --pattern SHA256SUMS --pattern "oie_${BOOTSTRAP_TAG}_linux_amd64*.tar.gz"
          GOBIN="$RUNNER_TEMP" GOWORK=off go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0
          python3 scripts/package-distribution.py --version "$BOOTSTRAP_TAG" --deb-only \
            --assets dist/bootstrap --output dist/bootstrap-package --nfpm "$RUNNER_TEMP/nfpm"
          cp dist/bootstrap-package/native/*.deb dist/pages/apt/pool/main/o/oie/
      - name: Index and sign the archive
        env:
          APT_SIGNING_KEY: ${{ secrets.OIE_APT_SIGNING_KEY }}
        run: |
          if [[ -z "$APT_SIGNING_KEY" ]]; then
            echo 'OIE_APT_SIGNING_KEY is missing from the apt-signing environment' >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils
          keyring=$(mktemp -d)
          trap 'gpgconf --homedir "$keyring" --kill gpg-agent; rm -r "$keyring"' EXIT
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --homedir "$keyring" --import
          bash scripts/build-apt-repository.sh dist/pages "$keyring" "$(cat packaging/apt/fingerprint)"
      - name: Verify the package can be acquired by name
        run: bash tests/packaging/smoke_apt.sh dist/pages
      - name: Record the signed archive checksums
        id: proof
        run: |
          cd dist/pages/apt
          echo "index_sha256=$(sha256sum dists/oie/InRelease | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "sources_sha256=$(sha256sum oie.sources | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          latest=
          while read -r version; do
            if [[ -z "$latest" ]] || dpkg --compare-versions "$version" gt "$latest"; then
              latest=$version
            fi
          done < <(sed -n 's/^Version: //p' dists/oie/main/binary-amd64/Packages)
          test -n "$latest"
          echo "version=$latest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}apt/
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the public APT archive
        env:
          INDEX_SHA256: ${{ needs.build.outputs.index_sha256 }}
          SOURCES_SHA256: ${{ needs.build.outputs.sources_sha256 }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          ARCHIVE_URL: ${{ steps.publish.outputs.page_url }}apt/
        run: bash tests/packaging/smoke_apt.sh "$ARCHIVE_URL" "$INDEX_SHA256" "$SOURCES_SHA256" "$EXPECTED_VERSION"
