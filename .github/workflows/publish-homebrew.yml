name: Publish Homebrew packages

on:
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    if: github.repository == 'araihu/oie' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    steps:
      - name: Mint a token for the Homebrew tap
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ARAIHU_ASSETS_APP_ID }}
          private-key: ${{ secrets.ARAIHU_ASSETS_APP_PRIVATE_KEY }}
          owner: araihu
          repositories: homebrew-oie
          permission-actions: write
      - name: Run the tap synchronization workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh workflow run sync.yml --repo araihu/homebrew-oie --ref main
