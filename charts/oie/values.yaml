image:
  repository: ghcr.io/araihu/oie
  # Defaults to the chart's appVersion. A digest takes precedence over the tag.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

persistence:
  enabled: true
  # Reuse a PersistentVolumeClaim in the release namespace.
  existingClaim: ""
  # null selects the cluster default. "" selects storage without a class.
  storageClass: null
  accessMode: ReadWriteOnce
  size: 10Gi

# Requires an image with hosted authentication support.
hosted:
  enabled: false
  publicURL: ""
  trustedTLSProxies: ""
  oidc:
    issuer: ""
    subject: ""
    clientID: ""
    clientSecretName: ""

# Existing installations can explicitly use an external authenticated proxy.
externalAuthentication: false
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecretName: ""
  annotations: {}

# Attach to an existing Gateway. Set parentRefs and hostnames when enabled.
httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []
  annotations: {}
  # Optional Gateway API rule durations (request and backendRequest).
  timeouts: {}

resources: {}
