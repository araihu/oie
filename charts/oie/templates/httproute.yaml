{{- if .Values.httpRoute.enabled }}
{{- if not (or .Values.hosted.enabled .Values.externalAuthentication) }}
{{- fail "Configure hosted authentication or set externalAuthentication for an authenticated proxy." }}
{{- end }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "Set httpRoute.parentRefs when enabling HTTPRoute." }}
{{- end }}
{{- if not .Values.httpRoute.hostnames }}
{{- fail "Set httpRoute.hostnames when enabling HTTPRoute." }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "oie.fullname" . }}
  labels:
    {{- include "oie.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "oie.fullname" . }}
          port: 80
      {{- with .Values.httpRoute.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
