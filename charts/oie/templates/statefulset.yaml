apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "oie.fullname" . }}
  labels:
    {{- include "oie.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "oie.fullname" . }}-peer
  replicas: 1
  selector:
    matchLabels:
      {{- include "oie.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oie.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.hosted.enabled }}
      initContainers:
        - name: configure-owner
          image: {{ include "oie.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - auth
            - init
            - --data-dir=/data
          env:
            - name: OIE_OIDC_ISSUER
              value: {{ required "Set hosted.oidc.issuer." .Values.hosted.oidc.issuer | toString | replace "$" "$$" | quote }}
            - name: OIE_OIDC_SUBJECT
              value: {{ required "Set hosted.oidc.subject." .Values.hosted.oidc.subject | toString | replace "$" "$$" | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      {{- end }}
      containers:
        - name: oie
          image: {{ include "oie.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.hosted.enabled }}
          args:
            - --role=hosted
            - --listen=0.0.0.0:8080
            - --probe-listen=0.0.0.0:8081
            - --data-dir=/data
          env:
            - name: OIE_PUBLIC_URL
              value: {{ required "Set hosted.publicURL." .Values.hosted.publicURL | toString | replace "$" "$$" | quote }}
            - name: OIE_TRUSTED_TLS_PROXIES
              value: {{ required "Set hosted.trustedTLSProxies." .Values.hosted.trustedTLSProxies | toString | replace "$" "$$" | quote }}
            - name: OIE_OIDC_CLIENT_ID
              value: {{ required "Set hosted.oidc.clientID." .Values.hosted.oidc.clientID | toString | replace "$" "$$" | quote }}
            - name: OIE_OIDC_CLIENT_SECRET_FILE
              value: /run/secrets/oidc/client-secret
          {{- else }}
          args: ["--listen", "0.0.0.0:8080", "--data-dir", "/data"]
          {{- if .Values.diagnostics.existingSecret }}
          env:
            - name: OIE_DIAGNOSTICS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.diagnostics.existingSecret | quote }}
                  key: {{ .Values.diagnostics.secretKey | quote }}
          {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.hosted.enabled }}
            - name: probes
              containerPort: 8081
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            {{- if .Values.hosted.enabled }}
            httpGet:
              path: /readyz
              port: probes
            {{- else }}
            httpGet:
              path: /api/v1/health
              port: http
            {{- end }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            {{- if .Values.hosted.enabled }}
            httpGet:
              path: /readyz
              port: probes
            {{- else }}
            httpGet:
              path: /api/v1/health
              port: http
            {{- end }}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            {{- if .Values.hosted.enabled }}
            httpGet:
              path: /livez
              port: probes
            {{- else }}
            httpGet:
              path: /api/v1/health
              port: http
            {{- end }}
            periodSeconds: 10
            timeoutSeconds: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.hosted.enabled }}
            - name: oidc
              mountPath: /run/secrets/oidc
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "oie.fullname" .)) .Values.persistence.existingClaim | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.hosted.enabled }}
        - name: oidc
          secret:
            secretName: {{ required "Set hosted.oidc.clientSecretName." .Values.hosted.oidc.clientSecretName | quote }}
            defaultMode: 0440
            items:
              - key: {{ default "client-secret" .Values.hosted.oidc.clientSecretKey | quote }}
                path: client-secret
        {{- end }}
