apiVersion: v1
kind: Service
metadata:
  name: {{ include "oie.fullname" . }}
  labels:
    {{- include "oie.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "oie.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oie.fullname" . }}-peer
  labels:
    {{- include "oie.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "oie.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
