overlay: 1.0.0
info:
  title: Oie engine CLI
  version: 0.1.0
actions:
  - target: $
    update:
      x-cli-local-problem-documentation:
        usage_error: https://github.com/araihu/oie/blob/docs/engine-api-problems/docs/engine-api-problems.md#usage_error
        transport_error: https://github.com/araihu/oie/blob/docs/engine-api-problems/docs/engine-api-problems.md#transport_error
  - target: $.components.schemas.Problem
    update:
      x-cli-problem-catalog:
        type-prefix: 'urn:oie:problem:'
        documentation-base: https://github.com/araihu/oie/blob/docs/engine-api-problems/docs/engine-api-problems.md
        titles:
          invalid_request: Invalid request
          not_found: Not Found
          idempotency_conflict: Idempotency key conflict
          account_exists: Account already exists
          invalid_cursor: Invalid event cursor
          history_changed: History changed
          unavailable: Service Unavailable
          state_conflict: State conflict
          protocol_unavailable: Protocol unavailable
          media_blocked: Media access blocked
          media_fetch_failed: Media fetch failed
          media_too_large: Media too large
          media_unsupported: Unsupported media
          range_not_satisfiable: Range not satisfiable
          media_busy: Media service busy
          media_timeout: Media request timed out
  # accounts
  - target: $.paths['/api/v1/avatars/{hash}'].get
    update:
      x-cli-group: [accounts, avatars]
      x-cli-name: download
      x-cli-ignore: false
      x-cli-description: Download a PNG using the imageHash from accounts avatars list.
      x-cli-example: |
        oiectl accounts avatars download --hash IMAGE_HASH --output raw > avatar.png
  - target: $.paths['/api/v1/accounts/{accountId}/avatars'].get
    update:
      x-cli-group: [accounts, avatars]
      x-cli-name: list
  - target: $.paths['/api/v1/accounts/{accountId}/capabilities'].get
    update:
      x-cli-name: capabilities
  - target: $.paths['/api/v1/accounts/{accountId}/connection'].put
    update:
      x-cli-name: connect
      x-cli-description: Connect an account using credentials from a private JSON file or stdin.
      x-cli-example: |
        oiectl accounts connect --account-id ACCOUNT_UUID --body-file connection.json
  - target: $.paths['/api/v1/accounts/{accountId}/connection'].get
    update:
      x-cli-name: connection
  - target: $.paths['/api/v1/contacts'].get
    update:
      x-cli-name: contacts
  - target: $.paths['/api/v1/accounts/{accountId}/connection'].delete
    update:
      x-cli-name: disconnect
  - target: $.paths['/api/v1/accounts/{accountId}'].get
    update:
      x-cli-name: get
  - target: $.paths['/api/v1/accounts/{accountId}/history'].get
    update:
      x-cli-name: history
  - target: $.paths['/api/v1/accounts'].get
    update:
      x-cli-name: list
  - target: $.paths['/api/v1/accounts'].post
    update:
      x-cli-name: register
  # conversations
  - target: $.paths['/api/v1/conversations/{conversationId}/details'].get
    update:
      x-cli-name: details
  - target: $.paths['/api/v1/conversations/{conversationId}'].get
    update:
      x-cli-name: get
  - target: $.paths['/api/v1/conversations/{conversationId}/room-session'].post
    update:
      x-cli-group: [conversations, rooms]
      x-cli-name: join
  - target: $.paths['/api/v1/conversations/{conversationId}/room-session/leave'].post
    update:
      x-cli-group: [conversations, rooms]
      x-cli-name: leave
  - target: $.paths['/api/v1/conversations'].get
    update:
      x-cli-name: list
  - target: $.paths['/api/v1/conversations/{conversationId}/read-state'].post
    update:
      x-cli-group: [conversations, reads]
      x-cli-name: mark
  - target: $.paths['/api/v1/conversations/{conversationId}/mention-candidates'].get
    update:
      x-cli-name: mentions
  - target: $.paths['/api/v1/conversations'].post
    update:
      x-cli-name: open
  - target: $.paths['/api/v1/conversations/{conversationId}/read-state'].get
    update:
      x-cli-group: [conversations, reads]
      x-cli-name: get
  - target: $.paths['/api/v1/conversations/{conversationId}/room-session'].get
    update:
      x-cli-group: [conversations, rooms]
      x-cli-name: status
  - target: $.paths['/api/v1/conversations/{conversationId}'].patch
    update:
      x-cli-group: [conversations, preferences]
      x-cli-name: set
  # events
  - target: $.paths['/api/v1/events'].get
    update:
      x-cli-name: stream
      x-cli-ignore: false
      x-cli-description: >-
        Print events as they arrive. The stream runs until it closes or reaches the
        request timeout (one minute by default). Resume from the last event ID you processed.
      x-cli-example: |
        oiectl events stream
        oiectl events stream --timeout 10m --last-event-id ENGINE_UUID:SEQUENCE
  # messages
  - target: $.paths['/api/v1/messages/{messageId}/cancel'].post
    update:
      x-cli-group: [messages, outbox]
      x-cli-name: cancel
  - target: $.paths['/api/v1/conversations/{conversationId}/messages/{messageId}/context'].get
    update:
      x-cli-name: context
  - target: $.paths['/api/v1/conversations/{conversationId}/reactions'].get
    update:
      x-cli-group: [messages, reactions]
      x-cli-name: list
  - target: $.paths['/api/v1/messages/{messageId}/edits'].post
    update:
      x-cli-group: [messages, edits]
      x-cli-name: submit
  - target: $.paths['/api/v1/message-edits/{editId}'].get
    update:
      x-cli-group: [messages, edits]
      x-cli-name: get
  - target: $.paths['/api/v1/messages/{messageId}/edit-history'].get
    update:
      x-cli-name: revisions
  - target: $.paths['/api/v1/messages/{messageId}/edit-target'].get
    update:
      x-cli-group: [messages, edits, targets]
      x-cli-name: get
  - target: $.paths['/api/v1/messages/{messageId}'].get
    update:
      x-cli-name: get
  - target: $.paths['/api/v1/conversations/{conversationId}/edit-target'].get
    update:
      x-cli-group: [messages, edits, targets]
      x-cli-name: latest
  - target: $.paths['/api/v1/conversations/{conversationId}/messages'].get
    update:
      x-cli-name: list
  - target: $.paths['/api/v1/message-reaction-commands/{commandId}'].get
    update:
      x-cli-group: [messages, reactions]
      x-cli-name: command
  - target: $.paths['/api/v1/messages/{messageId}/reactions'].get
    update:
      x-cli-group: [messages, reactions]
      x-cli-name: get
  - target: $.paths['/api/v1/messages/search'].get
    update:
      x-cli-name: search
  - target: $.paths['/api/v1/conversations/{conversationId}/messages'].post
    update:
      x-cli-name: send
      x-cli-description: >-
        Queue a text message for delivery. Use the returned message ID to check its
        delivery state with messages get. To retry the same request, reuse the key and body.
      x-cli-example: |
        printf '%s\n' '{"originalText":"Olá!"}' | oiectl messages send \
          --conversation-id CONVERSATION_UUID --idempotency-key REQUEST_UUID --body-stdin
  - target: $.paths['/api/v1/messages/{messageId}/sender-profile'].get
    update:
      x-cli-name: author
  - target: $.paths['/api/v1/messages/{messageId}/reactions'].post
    update:
      x-cli-group: [messages, reactions]
      x-cli-name: set
  - target: $.paths['/api/v1/messages/{messageId}/star'].put
    update:
      x-cli-group: [messages, stars]
      x-cli-name: set
  - target: $.paths['/api/v1/messages/{messageId}/star'].get
    update:
      x-cli-group: [messages, stars]
      x-cli-name: get
  - target: $.paths['/api/v1/starred-messages'].get
    update:
      x-cli-group: [messages, stars]
      x-cli-name: list
  - target: $.paths['/api/v1/conversations/{conversationId}/message-stars'].get
    update:
      x-cli-group: [messages, stars]
      x-cli-name: states
  # operations
  - target: $.paths['/api/v1/operations/{operationId}'].get
    update:
      x-cli-name: get
  # previews
  - target: $.paths['/api/v1/previews/{previewId}/download'].post
    update:
      x-cli-group: [previews, images]
      x-cli-name: request
  - target: $.paths['/api/v1/previews/{previewId}'].get
    update:
      x-cli-name: get
  - target: $.paths['/api/v1/media/{hash}'].get
    update:
      x-cli-group: [previews, images]
      x-cli-name: download
      x-cli-ignore: false
      x-cli-description: Download a retained preview image by its hash.
      x-cli-example: |
        oiectl previews images download --hash IMAGE_HASH --output raw > preview-image
  - target: $.paths['/api/v1/conversations/{conversationId}/previews'].get
    update:
      x-cli-name: list
  - target: $.paths['/api/v1/previews/{previewId}/refresh'].post
    update:
      x-cli-name: refresh
  - target: $.paths['/api/v1/shared-content/{itemId}/thumbnail'].post
    update:
      x-cli-group: [previews, thumbnails]
      x-cli-name: request
  - target: $.paths['/api/v1/shared-content/{itemId}/thumbnail'].get
    update:
      x-cli-group: [previews, thumbnails]
      x-cli-name: get
  # shared content
  - target: $.paths['/api/v1/shared-content/{itemId}/content'].get
    update:
      x-cli-group: [shared, content]
      x-cli-name: download
      x-cli-ignore: false
      x-cli-description: Download the original bytes of a shared item.
      x-cli-example: |
        oiectl shared content download --item-id ITEM_UUID --output raw > download
  - target: $.paths['/api/v1/shared-content'].get
    update:
      x-cli-group: [shared, content]
      x-cli-name: list
  # system
  - target: $.paths['/api/v1/engine'].get
    update:
      x-cli-name: engine
  - target: $.paths['/api/v1/health'].get
    update:
      x-cli-name: health
