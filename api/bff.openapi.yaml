openapi: 3.0.3
info:
  title: Oie browser presentation API
  version: 0.5.0
  description: Browser-only presentation operations. Engine data and protocol operations remain in the engine API.
  contact:
    name: Arai Hû
    url: https://github.com/araihu/oie
servers:
- url: http://127.0.0.1:8080
security: []
tags:
- name: Settings
  description: Browser settings actions
- name: Documents
  description: Static document presentation
- name: Conversations
  description: Browser conversation preference commands
- name: Messages
  description: Browser submission receipt recovery
paths:
  /ui/engine/reset:
    post:
      operationId: resetBrowserEngineData
      tags: [Settings]
      summary: Confirm deletion of all Oiê data
      description: Resets the selected engine and clears browser preference cookies on success.
      requestBody:
        description: Confirmation from the settings dialog, bound to the current engine.
        required: true
        content:
          application/x-www-form-urlencoded:
            example: {engineId: 019a5df0-0000-7000-8000-000000000003, confirmation: delete, csrf: example-browser-token}
            schema:
              type: object
              required: [engineId, confirmation, csrf]
              properties:
                engineId: {$ref: './openapi.yaml#/components/schemas/ID'}
                confirmation: {type: string, enum: [delete], example: delete}
                csrf: {type: string, example: example-browser-token}
      responses:
        '204': {description: Installation reset and empty engine ready.}
        '400': {description: Invalid confirmation or request.}
        '403': {description: Browser token missing or invalid.}
        '409': {description: Engine identity changed.}
        '503': {description: Engine data could not be reset.}
  /ui/room-archive/{conversationId}:
    parameters:
    - {$ref: './openapi.yaml#/components/parameters/ConversationID'}
    - name: X-Oie-Engine-ID
      in: header
      required: true
      description: Selected engine identity.
      schema: {type: string, format: uuid}
    - name: X-Oie-Account-ID
      in: header
      required: true
      description: Owning account identity.
      schema: {type: string, format: uuid}
    - name: X-CSRF-Token
      in: header
      required: true
      description: Same-origin browser token.
      schema: {type: string}
    post:
      operationId: requestBrowserRoomArchive
      tags: [Conversations]
      summary: Request an archive page for the selected room
      requestBody:
        description: Room archive action or mode submitted by the current view.
        required: true
        content:
          application/json:
            schema: {$ref: './openapi.yaml#/components/schemas/RoomArchiveRequest'}
            example: {action: focus}
      responses:
        '200':
          description: Verified room archive request result.
          content:
            application/json:
              schema: {$ref: './openapi.yaml#/components/schemas/RoomArchiveResult'}
              example: {archive: {conversationId: 019a5df0-0000-7000-8000-000000000003, mode: gradual, initialComplete: false, olderComplete: false, availability: supported, textSearch: unsupported}, outcome: stored, items: []}
        '400': {description: Invalid scope or request body.}
        '403': {description: Browser token missing or invalid.}
        '404': {description: Room unavailable in the selected account.}
        '409': {description: Engine changed.}
        '503': {description: Engine unavailable.}
    put:
      operationId: setBrowserRoomArchiveMode
      tags: [Conversations]
      summary: Set the archive mode for the selected room
      requestBody:
        description: Room archive action or mode submitted by the current view.
        required: true
        content:
          application/json:
            schema: {$ref: './openapi.yaml#/components/schemas/SetRoomArchiveMode'}
            example: {mode: on_demand}
      responses:
        '200':
          description: Verified room archive settings.
          content:
            application/json:
              schema: {$ref: './openapi.yaml#/components/schemas/RoomArchive'}
              example: {conversationId: 019a5df0-0000-7000-8000-000000000003, mode: gradual, initialComplete: false, olderComplete: false, availability: supported, textSearch: unsupported}
        '400': {description: Invalid scope or request body.}
        '403': {description: Browser token missing or invalid.}
        '404': {description: Room unavailable in the selected account.}
        '409': {description: Engine changed.}
        '503': {description: Engine unavailable.}
  /ui/api/v1/previews/{id}:
    parameters:
    - {in: path, name: id, required: true, description: Scoped resource identity., schema: {type: string, format: uuid}}
    - {in: header, name: X-Oie-Engine-ID, description: Selected engine identity., schema: {type: string, format: uuid}}
    get:
      operationId: getBrowserPreview
      tags: [Messages]
      summary: Read scoped browser metadata
      description: Browser projection of engine data with engine binding and no-store caching. This route is separate from the public engine API.
      responses:
        '200':
          description: Validated metadata
          content:
            application/json:
              schema: {$ref: './openapi.yaml#/components/schemas/MessagePreview'}
        '400': {description: Invalid scope}
        '404': {description: Resource unavailable}
        '409': {description: Engine or account changed}
        '503': {description: Engine unavailable}
  /ui/api/v1/shared-content/{id}/thumbnail:
    parameters:
    - {in: path, name: id, required: true, description: Scoped resource identity., schema: {type: string, format: uuid}}
    - {in: header, name: X-Oie-Engine-ID, description: Selected engine identity., schema: {type: string, format: uuid}}
    get:
      operationId: getBrowserVideoThumbnail
      tags: [Messages]
      summary: Read scoped browser metadata
      description: Browser projection of engine data with engine binding and no-store caching. This route is separate from the public engine API.
      responses:
        '200':
          description: Validated metadata
          content:
            application/json:
              schema: {$ref: './openapi.yaml#/components/schemas/VideoThumbnail'}
        '400': {description: Invalid scope}
        '404': {description: Resource unavailable}
        '409': {description: Engine or account changed}
        '503': {description: Engine unavailable}
  /ui/api/v1/conversations/{id}/read-state:
    parameters:
    - {in: path, name: id, required: true, description: Scoped resource identity., schema: {type: string, format: uuid}}
    - {in: header, name: X-Oie-Engine-ID, description: Selected engine identity., schema: {type: string, format: uuid}}
    get:
      operationId: getBrowserReadState
      tags: [Conversations]
      summary: Read scoped browser metadata
      description: Browser projection of engine data with engine binding and no-store caching. This route is separate from the public engine API.
      responses:
        '200':
          description: Validated metadata
          content:
            application/json:
              schema: {$ref: './openapi.yaml#/components/schemas/ConversationReadState'}
        '400': {description: Invalid scope}
        '404': {description: Resource unavailable}
        '409': {description: Engine or account changed}
        '503': {description: Engine unavailable}
    post:
      operationId: markBrowserMessagesRead
      tags: [Conversations]
      summary: Mark explicitly viewed messages read
      description: Requires the browser CSRF cookie and matching X-CSRF-Token, X-Oie-Account-ID and engine binding. Does not send protocol read receipts.
      parameters:
      - {in: header, name: Idempotency-Key, required: true, description: Original operation identity., schema: {type: string, format: uuid}}
      - {in: header, name: X-Oie-Account-ID, required: true, description: Selected account identity., schema: {type: string, format: uuid}}
      - {in: header, name: X-CSRF-Token, required: true, description: Matching browser CSRF token., schema: {type: string}}
      requestBody:
        required: true
        description: Explicitly viewed retained messages.
        content:
          application/json:
            schema: {$ref: './openapi.yaml#/components/schemas/MarkMessagesRead'}
      responses:
        '200':
          description: Current read state
          content:
            application/json:
              schema: {$ref: './openapi.yaml#/components/schemas/ConversationReadState'}
        '400': {description: Invalid scope or body}
        '403': {description: CSRF rejected}
        '404': {description: Resource unavailable}
        '409': {description: Engine or account changed}
        '503': {description: Engine unavailable}
  /ui/message-reactions:
    get:
      operationId: getBrowserMessageReactions
      tags: [Messages]
      summary: Read scoped reaction state and eligibility
      description: Reads retained reaction state without provider discovery or mutation. Returns a fresh operation key for an explicit choice.
      parameters:
      - {in: query, name: engineId, required: true, description: Selected engine identity., schema: {type: string, format: uuid}}
      - {in: query, name: accountId, required: true, description: Source account identity., schema: {type: string, format: uuid}}
      - {in: query, name: conversationId, required: true, description: Source conversation identity., schema: {type: string, format: uuid}}
      - {in: query, name: messageId, required: true, description: Canonical source message identity., schema: {type: string, format: uuid}}
      - {in: query, name: lang, description: Presentation language., schema: {type: string, enum: [en, pt-BR]}}
      responses:
        '200':
          description: Retained reaction snapshot and current sending eligibility
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrowserReactionPreparation'}
        '400': {description: Invalid scope}
        '404': {description: Source unavailable}
        '409': {description: Selected engine changed}
        '503': {description: Reaction state temporarily unavailable}
  /ui/messages/reactions:
    post:
      operationId: setBrowserMessageReactions
      tags: [Messages]
      summary: Submit one immutable own reaction set
      description: Verifies the selected engine and source scope and checks an existing receipt before submitting a durable reaction command. A lost response preserves the same frozen intent and operation key.
      requestBody:
        required: true
        description: Frozen selected reaction set and scope.
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/BrowserReactionIntent'}
      responses:
        '200':
          description: Matching durable command and actual dispatch state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrowserReactionResult'}
        '400': {description: Invalid form encoding}
        '403': {description: CSRF rejected}
        '404': {description: Source unavailable}
        '409': {description: State or frozen intent conflict}
        '422': {description: Invalid reaction set}
        '503': {description: Acceptance remains unconfirmed}
  /ui/messages/reaction-receipt:
    post:
      operationId: reconcileBrowserMessageReactions
      tags: [Messages]
      summary: Read a matching reaction command receipt
      description: Performs only an engine receipt GET, verifying the complete frozen intent. Never creates or retransmits a reaction. A missing receipt leaves acceptance unresolved.
      requestBody:
        required: true
        description: Identical immutable reaction intent.
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/BrowserReactionIntent'}
      responses:
        '200':
          description: Matching durable command and actual state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrowserReactionResult'}
        '400': {description: Invalid form encoding}
        '403': {description: CSRF rejected}
        '404': {description: Receipt absent and acceptance unresolved}
        '409': {description: Engine or frozen intent conflict}
        '422': {description: Invalid frozen intent}
        '503': {description: Receipt temporarily unavailable}
  /ui/message-edit-target:
    get:
      operationId: getBrowserMessageEditTarget
      tags: [Messages]
      summary: Prepare editing of the latest own sent text
      description: Read-only eligibility lookup. Omitting messageId asks the engine for its latest own canonical message, independently of the rendered timeline window. An ineligible latest message never falls back to an older message. Explicit messageId rechecks that source. Returns JSON for enhanced composition or a native read-only preparation form. Does not create or dispatch a correction.
      parameters:
      - {in: query, name: engineId, required: true, description: Owning engine identity., schema: {type: string, format: uuid}}
      - {in: query, name: accountId, required: true, description: Owning account identity., schema: {type: string, format: uuid}}
      - {in: query, name: conversationId, required: true, description: Owning conversation identity., schema: {type: string, format: uuid}}
      - {in: query, name: messageId, description: Optional exact own message to recheck., schema: {type: string, format: uuid}}
      - {in: query, name: lang, description: Presentation language., schema: {type: string, enum: [en, pt-BR]}}
      responses:
        '200':
          description: Scoped engine eligibility and a fresh key for a distinct explicit edit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrowserEditTarget'}
              example: {engineId: 019a5df0-0000-7000-8000-000000000001, operationKey: 019a5df0-0000-7000-8000-000000000006, target: {messageId: 019a5df0-0000-7000-8000-000000000004, accountId: 019a5df0-0000-7000-8000-000000000002, conversationId: 019a5df0-0000-7000-8000-000000000003, currentRevisionId: 019a5df0-0000-7000-8000-000000000005, originalText: Hello, eligible: true}}
            text/html:
              schema: {type: string}
              example: '<form method="post"></form>'
        '400': {description: Invalid scope}
        '404': {description: No retained own message in this scope}
        '409': {description: Engine identity changed}
        '503': {description: Eligibility temporarily unavailable}
  /ui/messages/edit:
    post:
      operationId: submitBrowserMessageEdit
      tags: [Messages]
      summary: Submit an immutable sent-text correction
      description: Requires CSRF and exact engine/account/conversation/message scope. Only the latest own engine-origin plain text without replies or mention selections is eligible in this increment. Expected content revision, text and operation key remain frozen after first submission. Matching existing receipt is checked before attempting a new command. Engine acceptance does not prove provider delivery. Native forms receive an HTML recovery view; enhanced callers receive JSON.
      requestBody:
        required: true
        description: Exact scoped correction intent retained across uncertain acceptance.
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/BrowserEditIntent'}
            example: {csrf: browser-csrf-token, engineId: 019a5df0-0000-7000-8000-000000000001, accountId: 019a5df0-0000-7000-8000-000000000002, conversationId: 019a5df0-0000-7000-8000-000000000003, messageId: 019a5df0-0000-7000-8000-000000000004, expectedRevisionId: 019a5df0-0000-7000-8000-000000000005, operationKey: 019a5df0-0000-7000-8000-000000000006, originalText: Corrected text}
      responses:
        '200':
          description: Matching command accepted by its owning engine
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrowserEditResult'}
              example: {ok: false, accepted: false, rejected: false, message: Acceptance remains unknown.}
            text/html:
              schema: {type: string}
              example: '<form method="post"></form>'
        '400': {description: Invalid form encoding}
        '403': {description: CSRF rejected before engine mutation}
        '404': {description: Source is absent}
        '409': {description: 'Content revision, latest source, eligibility, engine or operation intent changed'}
        '422': {description: Invalid correction intent}
        '503': {description: Acceptance is unknown; preserve exact intent and reconcile}
  /ui/messages/edit-receipt:
    post:
      operationId: reconcileBrowserMessageEdit
      tags: [Messages]
      summary: Read the receipt for one immutable correction
      description: Read-only engine GET by the original command UUID. POST keeps original text out of browser URLs and applies the same CSRF/scope rules as submission. Verifies the complete frozen intent before exposing a command. Never creates, retries or dispatches a correction. A missing receipt does not prove the original submission cannot arrive later.
      requestBody:
        required: true
        description: Same immutable intent as the first correction submission.
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/BrowserEditIntent'}
            example: {csrf: browser-csrf-token, engineId: 019a5df0-0000-7000-8000-000000000001, accountId: 019a5df0-0000-7000-8000-000000000002, conversationId: 019a5df0-0000-7000-8000-000000000003, messageId: 019a5df0-0000-7000-8000-000000000004, expectedRevisionId: 019a5df0-0000-7000-8000-000000000005, operationKey: 019a5df0-0000-7000-8000-000000000006, originalText: Corrected text}
      responses:
        '200':
          description: Matching existing command and actual dispatch state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrowserEditResult'}
              example: {ok: false, accepted: false, rejected: false, message: Acceptance remains unknown.}
            text/html:
              schema: {type: string}
              example: '<form method="post"></form>'
        '400': {description: Invalid form encoding}
        '403': {description: CSRF rejected}
        '404': {description: Receipt absent; acceptance remains unknown}
        '409': {description: Engine or frozen intent mismatch}
        '422': {description: Invalid frozen intent}
        '503': {description: Receipt evidence temporarily unavailable}
  /ui/message-history:
    get:
      operationId: getBrowserMessageEditHistory
      tags: [Messages]
      summary: Render one retained message history page
      description: Returns escaped, scoped content-history HTML without provider, profile or media requests or read-state changes. Requires one engine, account, conversation and retained message. Pages belong to one exact history snapshot; changed history requires restarting at the first page. Does not submit sends or edits.
      parameters:
      - in: query
        name: engineId
        required: true
        description: Identity of the selected owning engine.
        schema: {type: string, format: uuid}
      - in: query
        name: accountId
        required: true
        description: Owning account, checked against canonical message scope.
        schema: {type: string, format: uuid}
      - in: query
        name: conversationId
        required: true
        description: Conversation containing this retained message.
        schema: {type: string, format: uuid}
      - in: query
        name: messageId
        required: true
        description: Requested retained source, allowing engine-validated canonical aliases.
        schema: {type: string, format: uuid}
      - in: query
        name: cursor
        description: Engine-issued older-page cursor for the exact history snapshot.
        schema: {type: string, maxLength: 2048}
      - in: query
        name: lang
        description: Preferred presentation language.
        schema: {type: string, enum: [en, pt-BR]}
      responses:
        '200':
          description: One bounded history page, with engine/account/conversation/message/snapshot metadata for safe replacement
          content:
            text/html:
              schema: {type: string}
              example: '<section data-message-history-page></section>'
        '400':
          description: Invalid or foreign scope or cursor
        '404':
          description: Retained message unavailable in requested account/conversation
        '409':
          description: Engine or observed history changed; clear old versions and restart
        '503':
          description: Retained history temporarily unavailable; retry the same read
  /ui/sender:
    get:
      operationId: getBrowserMessageSender
      tags: [Messages]
      summary: Render the retained message author's information
      description: Read-only HTML fragment scoped to engine, account, conversation and retained message. Direct peers may use the conversation address and cached avatar/presence. Room authors may show a published name and personal address only from the scoped engine sender-profile operation backed by retained message-time identity evidence. Never resolve personal identity from a room nickname or infer current presence. Does not join rooms, subscribe to presence, mark read or mutate contacts.
      parameters:
      - in: query
        name: engineId
        description: Identity of the engine that owns the retained message.
        required: true
        schema: {type: string, format: uuid}
      - in: query
        name: accountId
        description: Owning account, checked against the message and conversation.
        required: true
        schema: {type: string, format: uuid}
      - in: query
        name: conversationId
        description: Conversation containing the retained source message.
        required: true
        schema: {type: string, format: uuid}
      - in: query
        name: messageId
        description: Retained message whose author is displayed.
        required: true
        schema: {type: string, format: uuid}
      - in: query
        name: lang
        description: Preferred presentation language.
        schema: {type: string, enum: [en, pt-BR]}
      responses:
        '200':
          description: Escaped sender information, including scope identifiers for safe fragment replacement
          content:
            text/html:
              schema: {type: string}
              example: '<section data-sender-info></section>'
        '400':
          description: Invalid scope identifiers
        '404':
          description: Message, conversation or account absent or scope mismatch
        '409':
          description: Engine identity changed
        '503':
          description: Saved information unavailable
  /ui/message-search:
    get:
      operationId: searchBrowserMessages
      tags: [Messages]
      summary: Render scoped retained message search results
      description: Returns escaped plain-text result HTML only. Blank queries do not call engine message search. No read receipt, provider operation, profile/media download or preview enrichment is triggered. Query and cursor are scoped to one engine, account, conversation and explicit edit-history choice. This fragment is separate from conversation-title filtering. Native GET /search accepts the same search fields and renders the application shell.
      parameters:
      - in: query
        name: engineId
        required: true
        description: Engine identity that owns this browser search session.
        schema:
          type: string
          format: uuid
      - in: query
        name: q
        description: Retained text/metadata query, trimmed before engine search. Empty means the local initial state.
        schema:
          type: string
          maxLength: 200
      - in: query
        name: accountId
        description: Optional owning account scope.
        schema:
          type: string
          format: uuid
      - in: query
        name: conversationId
        description: Optional conversation scope, validated within account when both are supplied.
        schema:
          type: string
          format: uuid
      - in: query
        name: includeEditHistory
        description: Include retained earlier content versions, explicitly labelled as prior versions.
        schema:
          type: boolean
          default: false
      - in: query
        name: cursor
        description: Opaque cursor bound to the exact normalized query and scopes.
        schema:
          type: string
          maxLength: 2048
      - in: query
        name: limit
        description: Maximum returned hits; browser requests use 30.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      - in: query
        name: lang
        description: Result locale.
        schema:
          type: string
          enum: [en, pt-BR]
      - in: query
        name: presentation
        description: Use compact excerpts that start near the first visible match in the floating search dialog.
        schema:
          type: string
          enum: [compact]
      responses:
        '200':
          description: Scoped HTML results or local blank-query state, with engine/query/scope/cursor metadata for safe swaps
          content:
            text/html:
              schema:
                type: string
              example: '<div id="message-search-page" data-search-state="ready"></div>'
        '400':
          description: Invalid query or stale/foreign cursor; render in-shell recovery
        '404':
          description: Account/conversation scope unavailable
        '409':
          description: The requested engine identity changed; old results must be cleared
        '503':
          description: Retained search unavailable; same scoped request can be retried
  /ui/conversations/preferences:
    post:
      operationId: updateBrowserConversationPreferences
      tags: [Conversations]
      summary: Archive or favorite one conversation
      description: Requires CSRF and the owning engine, account and conversation. The exact desired Boolean, expected revision and operation key are immutable during retry. No protocol action, room membership change or message submission occurs. Success and replay return a fresh canonical read, never the historical operation snapshot. Transport uncertainty retains the original intent even when current flags happen to match it. Native forms receive PRG on success or an HTML recovery page on failure.
      requestBody:
        required: true
        description: One explicit preference command, not a toggle.
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConversationPreferenceIntent'
      responses:
        '200':
          description: Matching command accepted and current conversation reread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPreferenceResult'
        '303':
          description: Native form success redirects to its safe application route
          headers:
            Location:
              description: Same-origin application route retaining the selected conversation.
              schema:
                type: string
        '400':
          description: Invalid form or account scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPreferenceResult'
        '403':
          description: CSRF rejected before engine mutation
        '404':
          description: Conversation no longer exists
        '409':
          description: Revision, operation intent or engine changed; a fresh explicit action is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPreferenceResult'
        '422':
          description: Invalid or ambiguous explicit preference command
        '503':
          description: Acceptance or canonical current state remains unknown; retry the same immutable command
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPreferenceResult'
  /ui/messages/reconcile:
    post:
      operationId: reconcileBrowserSubmission
      tags: [Messages]
      summary: Check acceptance of an immutable pending submission
      description: Read-only lookup of an existing engine operation and message. Never creates or dispatches a message. Requires the same CSRF token, engine, account, conversation, operation key, text, reply target and mention selections as the original send. Returns acceptance only when the complete intent matches. A missing receipt does not prove that the original request cannot still arrive.
      requestBody:
        required: true
        description: Frozen original submission, scoped to its engine and conversation.
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PendingSubmission'
            example:
              csrf: browser-csrf-token
              engineId: 019a5df0-0000-7000-8000-000000000001
              accountId: 019a5df0-0000-7000-8000-000000000002
              conversationId: 019a5df0-0000-7000-8000-000000000003
              operationKey: 019a5df0-0000-7000-8000-000000000006
              originalText: Hello
      responses:
        '200':
          description: Existing matching operation proves engine acceptance, not provider delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionReceipt'
              example:
                ok: true
                accepted: true
                message: Message saved by the engine.
                messageId: 019a5df0-0000-7000-8000-000000000004
                state: queued
                nextKey: 019a5df0-0000-7000-8000-000000000007
        '400':
          description: Invalid or oversized form encoding
        '403':
          description: Invalid or cross-site CSRF token
        '404':
          description: No existing operation receipt yet; submission remains uncertain
        '409':
          description: Engine changed or operation intent conflicts
        '422':
          description: Invalid frozen submission
        '503':
          description: Receipt or engine evidence unavailable
  /ui/document-markdown:
    post:
      operationId: renderDocumentMarkdown
      tags: [Documents]
      summary: Render a bounded Markdown document fragment
      description: Read-only rendering through Margo. No provider URLs are fetched. Active HTML, document runtimes and image fetching are excluded. Input is limited to 2 MiB of UTF-8 and output to 8 MiB. Preview callers send only their bounded prefix. Oversized or invalid documents retain the plain-text viewer fallback.
      requestBody:
        description: Bounded caller-supplied Markdown for static presentation.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkdownSource'
            example:
              source: '# Release notes'
      responses:
        '200':
          description: Static HTML fragment for the document surface
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkdownFragment'
              example:
                html: '<h1>Release notes</h1>'
        '400':
          description: Invalid JSON or source encoding
        '413':
          description: Input exceeds the byte limit
        '422':
          description: Document cannot be rendered within the presentation policy
        '503':
          description: Rendering capacity is occupied
components:
  schemas:
    BrowserReactionPreparation:
      description: Scoped read-only reaction eligibility and a fresh explicit-intent key.
      example: {engineId: 019a5df0-0000-7000-8000-000000000001, operationKey: 019a5df0-0000-7000-8000-000000000006, snapshot: {messageId: 019a5df0-0000-7000-8000-000000000004, accountId: 019a5df0-0000-7000-8000-000000000002, conversationId: 019a5df0-0000-7000-8000-000000000003, revisionId: null, ownRevisionId: null, ownEmojis: [], items: [], eligible: true, maxEmojis: 8}}
      type: object
      additionalProperties: false
      required: [engineId, snapshot, operationKey]
      properties:
        engineId: {type: string, format: uuid, description: Verified selected engine identity., example: 019a5df0-0000-7000-8000-000000000001}
        operationKey: {type: string, format: uuid, description: Fresh UUID for one explicit reaction choice., example: 019a5df0-0000-7000-8000-000000000006}
        snapshot: {$ref: './openapi.yaml#/components/schemas/MessageReactions'}
    BrowserReactionIntent:
      description: Complete immutable reaction choice retained for receipt reconciliation.
      example: {csrf: browser-csrf-token, engineId: 019a5df0-0000-7000-8000-000000000001, accountId: 019a5df0-0000-7000-8000-000000000002, conversationId: 019a5df0-0000-7000-8000-000000000003, messageId: 019a5df0-0000-7000-8000-000000000004, operationKey: 019a5df0-0000-7000-8000-000000000006, expectedOwnRevisionId: '', emojis: '[]', lang: en}
      type: object
      additionalProperties: false
      required: [csrf, engineId, accountId, conversationId, messageId, operationKey, emojis]
      properties:
        csrf: {type: string, description: Same-origin browser CSRF token.}
        engineId: {type: string, format: uuid, description: Selected owning engine.}
        accountId: {type: string, format: uuid, description: Source account.}
        conversationId: {type: string, format: uuid, description: Source conversation.}
        messageId: {type: string, format: uuid, description: Canonical retained source.}
        operationKey: {type: string, format: uuid, description: Stable command UUID retained across uncertain acceptance.}
        expectedOwnRevisionId: {type: string, description: Current own reaction revision UUID or empty when absent.}
        emojis: {type: string, maxLength: 4096, description: JSON encoded complete own emoji set. An empty array clears it.}
        lang: {type: string, enum: [en, pt-BR], description: Response presentation locale.}
    BrowserReactionResult:
      description: Verified acceptance and actual dispatch evidence for one reaction command.
      example: {ok: false, accepted: false, rejected: false, message: Reaction unconfirmed}
      type: object
      additionalProperties: false
      required: [ok, accepted, rejected, message]
      properties:
        ok: {type: boolean, description: A matching verified command was read.}
        accepted: {type: boolean, description: Durable acceptance of the exact immutable intent is verified.}
        rejected: {type: boolean, description: Definitive non-acceptance permits a new explicit intent.}
        message: {type: string, description: Concise localized user status.}
        code: {type: string, description: Stable failure code.}
        command: {$ref: './openapi.yaml#/components/schemas/MessageReactionCommand'}
    BrowserEditTarget:
      example: {engineId: 019a5df0-0000-7000-8000-000000000001, operationKey: 019a5df0-0000-7000-8000-000000000006, target: {messageId: 019a5df0-0000-7000-8000-000000000004, accountId: 019a5df0-0000-7000-8000-000000000002, conversationId: 019a5df0-0000-7000-8000-000000000003, currentRevisionId: 019a5df0-0000-7000-8000-000000000005, originalText: Hello, eligible: true}}
      type: object
      additionalProperties: false
      description: Browser-scoped engine edit preparation.
      required: [engineId, target, operationKey]
      properties:
        engineId: {type: string, format: uuid, description: Owning engine identity., example: 019a5df0-0000-7000-8000-000000000001}
        target: {$ref: './openapi.yaml#/components/schemas/MessageEditTarget'}
        operationKey: {type: string, format: uuid, description: Fresh key for a new explicit command., example: 019a5df0-0000-7000-8000-000000000006}
    BrowserEditIntent:
      example: {csrf: browser-csrf-token, engineId: 019a5df0-0000-7000-8000-000000000001, accountId: 019a5df0-0000-7000-8000-000000000002, conversationId: 019a5df0-0000-7000-8000-000000000003, messageId: 019a5df0-0000-7000-8000-000000000004, expectedRevisionId: 019a5df0-0000-7000-8000-000000000005, operationKey: 019a5df0-0000-7000-8000-000000000006, originalText: Corrected text}
      type: object
      additionalProperties: false
      description: Frozen command, never a mutation of a pending original send.
      required: [csrf, engineId, accountId, conversationId, messageId, expectedRevisionId, operationKey, originalText]
      properties:
        csrf: {type: string, description: Same-origin browser CSRF token.}
        engineId: {type: string, format: uuid, description: Owning engine identity., example: 019a5df0-0000-7000-8000-000000000001}
        accountId: {type: string, format: uuid, description: Owning account identity.}
        conversationId: {type: string, format: uuid, description: Owning conversation identity.}
        messageId: {type: string, format: uuid, description: Exact canonical source to correct.}
        expectedRevisionId: {type: string, format: uuid, description: Exact retained content head chosen while preparing the edit.}
        operationKey: {type: string, format: uuid, description: Immutable correction command identity.}
        originalText: {type: string, minLength: 1, maxLength: 16384, description: "Exact replacement plain text, without modifying reply targets or mention selections."}
        lang: {type: string, enum: [en, pt-BR], description: Presentation language.}
    BrowserEditResult:
      example: {ok: false, accepted: false, rejected: false, message: Acceptance remains unknown.}
      type: object
      additionalProperties: false
      description: Engine acceptance and provider dispatch state are separate evidence.
      required: [ok, accepted, rejected, message]
      properties:
        ok: {type: boolean, description: A matching engine command was obtained.}
        accepted: {type: boolean, description: "Owning engine retained this exact command, independently of provider dispatch."}
        rejected: {type: boolean, description: This submission was definitively rejected; unknown acceptance never sets this flag.}
        message: {type: string, description: Localized status or recovery explanation.}
        code: {type: string, description: Stable error code when available.}
        command: {$ref: './openapi.yaml#/components/schemas/MessageEditCommand'}
    ConversationPreferenceIntent:
      type: object
      additionalProperties: false
      description: Browser command scoped to one engine and one owning account.
      required: [csrf, engineId, accountId, conversationId, operationKey, expectedRevisionId]
      oneOf:
      - required: [archived]
      - required: [favorite]
      properties:
        csrf:
          type: string
          description: Browser CSRF token.
          example: browser-csrf-token
        engineId:
          type: string
          format: uuid
          description: Engine that owns the conversation.
          example: 019a5df0-0000-7000-8000-000000000001
        accountId:
          type: string
          format: uuid
          description: Owning account UUID.
          example: 019a5df0-0000-7000-8000-000000000002
        conversationId:
          type: string
          format: uuid
          description: Conversation UUID.
          example: 019a5df0-0000-7000-8000-000000000003
        operationKey:
          type: string
          format: uuid
          description: Immutable idempotency key, retained across uncertain retries.
          example: 019a5df0-0000-7000-8000-000000000004
        expectedRevisionId:
          type: string
          format: uuid
          description: Exact original compare-and-swap revision.
          example: 019a5df0-0000-7000-8000-000000000005
        archived:
          type: boolean
          description: Explicit archive state; send exactly this or favorite.
          example: true
        favorite:
          type: boolean
          description: Explicit conversation favorite state, independent of message stars.
          example: true
        returnTo:
          type: string
          description: Safe application route retained by native PRG.
          example: /?chat=019a5df0-0000-7000-8000-000000000003
        formTarget:
          type: string
          description: Browser form identity for native recovery.
          example: conversation-preferences-019a5df0-0000-7000-8000-000000000003-archive
        lang:
          type: string
          enum: [en, pt-BR]
          description: Result locale.
          example: en
    ConversationPreferenceResult:
      type: object
      additionalProperties: false
      description: Verified current state and command acceptance are distinct evidence.
      required: [ok, message]
      properties:
        ok:
          type: boolean
          description: Matching operation accepted and canonical conversation available.
          example: true
        message:
          type: string
          description: Localized outcome or recovery explanation.
          example: Conversation updated.
        conversation:
          $ref: './openapi.yaml#/components/schemas/Conversation'
        code:
          type: string
          description: Stable failure code.
          example: state_conflict
        rejected:
          type: boolean
          description: Definitive rejection permits a fresh explicit intent.
          example: false
        preferencesPending:
          type: boolean
          description: Preserve and retry the same immutable intent.
          example: false
        nextKey:
          type: string
          format: uuid
          description: New key for a distinct explicit action after resolution.
          example: 019a5df0-0000-7000-8000-000000000006
    PendingSubmission:
      example:
        csrf: browser-csrf-token
        engineId: 019a5df0-0000-7000-8000-000000000001
        accountId: 019a5df0-0000-7000-8000-000000000002
        conversationId: 019a5df0-0000-7000-8000-000000000003
        operationKey: 019a5df0-0000-7000-8000-000000000006
        originalText: Hello
      description: Immutable device submission used only for receipt lookup.
      type: object
      additionalProperties: false
      required: [csrf, engineId, accountId, conversationId, operationKey, originalText]
      properties:
        csrf:
          example: browser-csrf-token
          type: string
          description: Same-origin CSRF token from the composer.
        engineId:
          example: 019a5df0-0000-7000-8000-000000000001
          type: string
          format: uuid
          description: Selected engine identity.
        accountId:
          example: 019a5df0-0000-7000-8000-000000000002
          type: string
          format: uuid
          description: Sending account identity.
        conversationId:
          example: 019a5df0-0000-7000-8000-000000000003
          type: string
          format: uuid
          description: Sending conversation identity.
        operationKey:
          example: 019a5df0-0000-7000-8000-000000000006
          type: string
          format: uuid
          description: Original send operation key, never replaced during retry.
        originalText:
          example: Hello
          type: string
          minLength: 1
          maxLength: 16384
          description: Exact authored body before any protocol reply fallback.
        replyToMessageId:
          example: 019a5df0-0000-7000-8000-000000000008
          type: string
          description: Original reply target UUID, or empty for no reply.
        mentions:
          example: '[]'
          type: string
          description: JSON-encoded original mention selections.
        lang:
          example: en
          type: string
          enum: [en, pt-BR]
          description: UI response locale.
        theme:
          example: dark
          type: string
          enum: [light, dark, system]
          description: Retained composer theme.
    SubmissionReceipt:
      example:
        ok: true
        accepted: true
        message: Message saved by the engine.
        messageId: 019a5df0-0000-7000-8000-000000000004
        state: queued
        nextKey: 019a5df0-0000-7000-8000-000000000007
      description: Verified acceptance of the same immutable operation.
      type: object
      additionalProperties: false
      required: [ok, accepted, message, messageId, state, nextKey]
      properties:
        ok:
          example: true
          type: boolean
          description: Lookup succeeded.
        accepted:
          example: true
          type: boolean
          description: A matching persisted operation and message exist.
        message:
          example: Message saved by the engine.
          type: string
          description: Localized result.
        messageId:
          example: 019a5df0-0000-7000-8000-000000000004
          type: string
          format: uuid
          description: Canonical accepted message to replace the local bubble.
        state:
          example: queued
          type: string
          description: Engine transport evidence, independent of acceptance.
        nextKey:
          example: 019a5df0-0000-7000-8000-000000000007
          type: string
          format: uuid
          description: Fresh key for a subsequent distinct send.
    MarkdownSource:
      description: Authored source text for a static Markdown document.
      example:
        source: '# Release notes'
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          type: string
          maxLength: 2097152
          description: Authored Markdown text, never a URL to fetch.
          example: '# Release notes'
    MarkdownFragment:
      description: Static presentation fragment filtered by the host.
      example:
        html: '<h1>Release notes</h1>'
      type: object
      additionalProperties: false
      required: [html]
      properties:
        html:
          type: string
          maxLength: 8388608
          description: Static host-filtered HTML without resource-loading elements or document IDs.
          example: '<h1>Release notes</h1>'
