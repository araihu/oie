openapi: 3.0.3
info:
  title: Oie UI mock read API
  version: 0.2.0
  description: Draft UI mock read contract aligned with the engine messaging contract.
    Optional presentation/media extensions are sample-only until integration.
  contact:
    name: Arai Hû
    url: https://github.com/araihu/oie
servers:
- url: http://127.0.0.1:18082
  description: Independent development mock API
security: []
tags:
- name: Conversations
  description: Account-scoped direct conversations
- name: Messages
  description: Retained text messages and durable send intents
paths:
  /api/v1/conversations:
    get:
      operationId: listConversations
      tags:
      - Conversations
      summary: List retained conversations
      description: Keyset pages ordered by descending engine activity. Search matches
        conversation address/title and latest text preview; this is not full message
        search.
      responses:
        '200':
          description: Current resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
              example:
                items: []
        '400':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: cursor
        in: query
        description: Opaque nextCursor from the preceding page.
        schema:
          type: string
          maxLength: 100
      - name: limit
        in: query
        description: Maximum page size.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: accountId
        in: query
        required: false
        description: Stable accountId reference.
        schema:
          $ref: '#/components/schemas/ID'
      - name: q
        in: query
        description: Conversation address/title/latest-preview substring.
        schema:
          type: string
          maxLength: 200
      - name: unreadOnly
        in: query
        description: Only conversations with unread messages.
        schema:
          type: boolean
      - name: favoritesOnly
        in: query
        description: Only favorite conversations.
        schema:
          type: boolean
      - name: archived
        in: query
        description: Archived state; defaults to false.
        schema:
          type: boolean
      - name: kind
        in: query
        description: Conversation kind.
        schema:
          type: string
          enum:
          - direct
          - room
  /api/v1/conversations/{conversationId}:
    parameters:
    - $ref: '#/components/parameters/ConversationID'
    get:
      operationId: getConversation
      tags:
      - Conversations
      summary: Read a conversation
      description: Returns the current conversation projection.
      responses:
        '200':
          description: Current resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
              example:
                id: 019a5df0-0000-7000-8000-000000000001
                revisionId: 019a5df0-0000-7000-8000-000000000001
                accountId: 019a5df0-0000-7000-8000-000000000001
                kind: direct
                address: bob@localhost
                title: bob@localhost
                lastMessage: Hello from Oie!
                updatedAt: '2026-11-07T12:00:00Z'
                unreadCount: 0
                archived: false
                favorite: false
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/conversations/{conversationId}/messages:
    parameters:
    - $ref: '#/components/parameters/ConversationID'
    get:
      operationId: listMessages
      tags:
      - Messages
      summary: Read retained messages
      description: Returns newest-first pages. This milestone has live ingestion,
        not MAM history backfill.
      responses:
        '200':
          description: Current resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
              example:
                items: []
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: cursor
        in: query
        description: Read records older than this nextCursor UUID.
        schema:
          $ref: '#/components/schemas/ID'
      - name: limit
        in: query
        description: Maximum page size.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
components:
  schemas:
    ID:
      type: string
      format: uuid
      x-go-type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      description: Canonical lowercase UUIDv7; IDs do not establish causal order.
    Problem:
      type: object
      example:
        type: urn:oie:problem:unavailable
        status: 503
        title: Service Unavailable
        code: unavailable
      additionalProperties: false
      description: Stable codes for presentation-owned localization; no raw storage
        errors or credentials.
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          example: urn:oie:problem:unavailable
        title:
          type: string
          example: Service Unavailable
        status:
          type: integer
          example: 503
        code:
          type: string
          enum:
          - invalid_request
          - not_found
          - idempotency_conflict
          - account_exists
          - invalid_cursor
          - unavailable
          - state_conflict
          - protocol_unavailable
          example: unavailable
        currentMessage:
          $ref: '#/components/schemas/Message'
    Message:
      type: object
      description: Retained original text and actual send evidence. submitted means
        the stanza was written to the authenticated stream; it does not prove provider
        acceptance, recipient delivery, or read state. unknown is not automatically
        resent.
      additionalProperties: false
      required:
      - id
      - revisionId
      - accountId
      - conversationId
      - sender
      - originalText
      - createdAt
      - isOwn
      - sendState
      properties:
        id:
          $ref: '#/components/schemas/ID'
        revisionId:
          $ref: '#/components/schemas/ID'
        accountId:
          $ref: '#/components/schemas/ID'
        conversationId:
          $ref: '#/components/schemas/ID'
        sender:
          $ref: '#/components/schemas/Sender'
        originalText:
          type: string
          description: Unmodified original text.
        createdAt:
          type: string
          format: date-time
          description: UTC timestamp.
        isOwn:
          type: boolean
        sendState:
          type: string
          description: Durable transport evidence.
          enum:
          - received
          - queued
          - dispatching
          - submitted
          - unknown
          - failed
          - cancelled
        attachment:
          $ref: '#/components/schemas/Attachment'
      example:
        id: 019a5df0-0000-7000-8000-000000000001
        revisionId: 019a5df0-0000-7000-8000-000000000001
        accountId: 019a5df0-0000-7000-8000-000000000001
        conversationId: 019a5df0-0000-7000-8000-000000000001
        sender:
          id: 019a5df0-0000-7000-8000-000000000001
          displayName: bob@localhost
        originalText: Hello from Oie!
        createdAt: '2026-11-07T12:00:00Z'
        isOwn: false
        sendState: received
    Sender:
      type: object
      description: Stable engine-local protocol identity for a sender.
      additionalProperties: false
      required:
      - id
      - displayName
      properties:
        id:
          $ref: '#/components/schemas/ID'
        displayName:
          type: string
          description: Display name, initially a protocol address.
      example:
        id: 019a5df0-0000-7000-8000-000000000001
        displayName: bob@localhost
    MessagePage:
      type: object
      description: Messages newest first in stable engine ingestion-ID order. Use
        nextCursor for older records; render the page in reverse for a chronological
        timeline.
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        nextCursor:
          $ref: '#/components/schemas/ID'
      example:
        items: []
    Conversation:
      type: object
      description: One account-scoped conversation. This milestone creates direct
        conversations; rooms are not implemented.
      additionalProperties: false
      required:
      - id
      - revisionId
      - accountId
      - kind
      - address
      - title
      - lastMessage
      - updatedAt
      - unreadCount
      - archived
      - favorite
      properties:
        id:
          $ref: '#/components/schemas/ID'
        revisionId:
          $ref: '#/components/schemas/ID'
        accountId:
          $ref: '#/components/schemas/ID'
        kind:
          type: string
          description: Conversation kind.
          enum:
          - direct
          - room
        address:
          type: string
          description: Canonical peer address.
        title:
          type: string
          description: Display title; initially the peer address.
        lastMessage:
          type: string
          description: Original text preview of the most recently retained message.
        updatedAt:
          type: string
          format: date-time
          description: UTC timestamp.
        unreadCount:
          type: integer
          minimum: 0
        archived:
          type: boolean
        favorite:
          type: boolean
        initials:
          type: string
          description: Optional mock presentation initials; clients derive a fallback
            from title.
        participants:
          type: array
          description: Optional mock participant display names, not a completed roster
            capability.
          items:
            type: string
          example:
          - Ana
          - Nina
      example:
        id: 019a5df0-0000-7000-8000-000000000001
        revisionId: 019a5df0-0000-7000-8000-000000000001
        accountId: 019a5df0-0000-7000-8000-000000000001
        kind: direct
        address: bob@localhost
        title: bob@localhost
        lastMessage: Hello from Oie!
        updatedAt: '2026-11-07T12:00:00Z'
        unreadCount: 0
        archived: false
        favorite: false
    ConversationPage:
      type: object
      description: Conversations in descending engine activity order. New activity
        can move items between pages; reconcile using stable IDs and SSE.
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        nextCursor:
          type: string
          description: Opaque engine-scoped activity cursor.
      example:
        items: []
    Attachment:
      type: object
      description: Sample-only media card metadata, independent of actual provider
        upload capabilities.
      additionalProperties: false
      required:
      - kind
      - title
      - description
      - previewUrl
      properties:
        kind:
          type: string
          enum:
          - image
          - link
        title:
          type: string
        description:
          type: string
        previewUrl:
          type: string
      example:
        kind: image
        title: Fresh air
        description: Sample illustration
        previewUrl: /ui/preview-landscape.svg
  responses:
    Unavailable:
      description: Persistence temporarily unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:oie:problem:unavailable
            title: Service Unavailable
            status: 503
            code: unavailable
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:oie:problem:not_found
            title: Not Found
            status: 404
            code: not_found
    Invalid:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:oie:problem:invalid_request
            title: Bad Request
            status: 400
            code: invalid_request
    Conflict:
      description: Idempotency conflict, duplicate address, or invalid stream cursor
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:oie:problem:idempotency_conflict
            title: Conflict
            status: 409
            code: idempotency_conflict
  parameters:
    ConversationID:
      name: conversationId
      in: path
      required: true
      description: Stable conversationId UUIDv7.
      schema:
        $ref: '#/components/schemas/ID'
