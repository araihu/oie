openapi: 3.0.3
info:
  title: Oie Engine API
  version: 0.22.0
  description: Native engine API for account metadata, XMPP connections, text conversations, reply composition, explicit room sessions, durable message
    acceptance, and replayable SSE. Credentials are write-only and stored only by the owning engine. All timestamps
    are UTC and entity/operation IDs are UUIDv7. HTML belongs to the BFF.
  contact:
    name: Arai Hû
    url: https://github.com/araihu/oie
servers:
- url: http://127.0.0.1:8080
  description: Local development engine
security: []
tags:
- name: System
  description: Engine identity and readiness
- name: Accounts
  description: Protocol account metadata
- name: Operations
  description: Durable mutation receipts
- name: Events
  description: Recoverable engine changes
- name: Conversations
  description: Account-scoped direct conversations and recovered read-only rooms
- name: Messages
  description: Retained text messages and durable send intents
- name: Previews
  description: Cached structured link cards and explicitly downloaded images
- name: SharedContent
  description: Source-linked media, documents and links across retained conversations
paths:
  /api/v1/contacts:
    get:
      tags: [Accounts]
      operationId: listContacts
      summary: Search saved protocol contacts
      description: Read the retained per-account contact directory without fetching a roster, changing subscriptions, adding contacts or opening conversations. Unknown and unavailable sources are distinct from an observed empty roster. Cached contacts remain searchable while disconnected. Results are ordered by stable contact UUID and filtered before pagination.
      parameters:
      - name: q
        in: query
        description: Optional trimmed UTF-8 text, at most 200 Unicode code points. Matches saved name, address, groups and account label.
        schema:
          type: string
          maxLength: 200
      - name: accountId
        in: query
        description: Restrict contacts to one owning account.
        schema:
          $ref: '#/components/schemas/ID'
      - name: cursor
        in: query
        description: Opaque position bound to the engine, account and trimmed query.
        schema:
          type: string
          maxLength: 512
      - name: limit
        in: query
        description: Maximum number of contacts returned.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Saved contacts with independent provider observation coverage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactPage'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/messages/search:
    get:
      tags: [Messages]
      operationId: searchMessages
      summary: Search retained message text and available metadata
      description: >-
        Search the complete retained engine history before pagination, without network
        retrieval, enrichment or read-state changes. Matching follows shared-content
        accent/case folding, word prefixes and bounded typing-error tolerance. Current
        canonical message content is searched by default. Include edit history adds
        separately labelled verified earlier content revisions, never transport-state
        revisions or independent correction aliases. Current associated URLs, filenames
        and cached page titles/descriptions are searched only while their catalog source
        is current. Metadata coverage can lag immediate message-text coverage.
        Order is newest original message timestamp at UTC millisecond precision and UUID first, current hit before
        earlier content revisions, then newest revision timestamp and UUID. New arrivals
        or corrections can change subsequent results; pages are not a frozen snapshot.
      parameters:
      - name: q
        in: query
        required: true
        description: Trimmed nonblank UTF-8 search text, at most 200 Unicode code points; NUL is invalid.
        example: software livre
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: accountId
        in: query
        description: Restrict to one owning account, or omit for all accounts.
        schema:
          $ref: '#/components/schemas/ID'
      - name: conversationId
        in: query
        description: Restrict to one conversation. A supplied account must own it.
        schema:
          $ref: '#/components/schemas/ID'
      - name: includeEditHistory
        in: query
        description: Include retained verified earlier content revisions with explicit historical labels.
        schema:
          type: boolean
          default: false
      - name: cursor
        in: query
        description: Opaque keyset cursor bound to this engine, trimmed query, account, conversation and history filter. Reuse with changed scope is invalid.
        schema:
          type: string
          maxLength: 2048
      - name: limit
        in: query
        description: Maximum returned hits. Filtering is applied before this limit.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Bounded message hits and current metadata coverage, including an empty page when nothing matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSearchPage'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/shared-content:
    get:
      tags: [SharedContent]
      operationId: listSharedContent
      summary: Browse shared content across retained conversations
      description: >-
        Browse the local derived catalog, newest original message time first with
        item UUID ties at millisecond precision. Account/conversation filters apply
        before pagination. Metadata search covers URL, filename, visible caption,
        cached preview title/description, sender, conversation and account label.
        A background worker indexes all retained and incoming messages. Listing
        registers preview enrichment only for the returned image/link references;
        originals still follow device preferences and explicit download operations.
        Document/audio entries remain URL references. Video bytes are available only through
        the explicit content operation; listing does not fetch video metadata or bytes.
        Backfill or new arrivals may insert items before the current cursor; reload
        to include them. A conversation filter with another account is invalid.
      parameters:
      - name: type
        description: Content category; media combines image, audio and video references; video restricts to video before pagination.
        in: query
        schema:
          type: string
          enum: [media, links, documents, video]
          default: media
      - name: accountId
        description: Restrict to one owning account, or omit for all accounts.
        in: query
        schema:
          $ref: '#/components/schemas/ID'
      - name: conversationId
        description: Restrict to one source conversation, or omit for all conversations.
        in: query
        schema:
          $ref: '#/components/schemas/ID'
      - name: messageId
        description: Restrict to at most one hundred unique source message UUIDs. Requires conversationId; filters before pagination.
        in: query
        style: form
        explode: true
        example: [019a5df0-0000-7000-8000-000000000101]
        schema:
          type: array
          maxItems: 100
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ID'
      - name: q
        description: >-
          Accent- and case-insensitive metadata search, applied before pagination.
          Exact substrings and word prefixes match. Otherwise all query terms must
          match a metadata word or prefix, in any order. Terms with letters of four
          to seven characters allow one insertion, deletion, substitution or
          adjacent transposition; terms of eight or more allow two. Shorter terms,
          pure numbers and symbols require exact matches. Result order remains
          chronological.
        in: query
        schema:
          type: string
          maxLength: 200
      - name: cursor
        in: query
        description: Opaque source-millisecond/item-UUID keyset cursor returned by this operation.
        schema:
          type: string
          maxLength: 512
      - name: limit
        description: Maximum returned items, independent of indexing batch size.
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Shared items and catalog indexing progress in the selected account/conversation scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedContentPage'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/shared-content/{itemId}/thumbnail:
    parameters:
    - name: itemId
      in: path
      required: true
      description: Retained video reference UUID. Arbitrary provider addresses are not accepted.
      schema:
        $ref: '#/components/schemas/ID'
    get:
      tags: [Previews]
      operationId: getVideoThumbnail
      summary: Read a retained video thumbnail state
      description: Reads local cache state for a current video reference without retrieving provider bytes. A missing cache record is represented as not_requested. Removed references return 404.
      responses:
        '200':
          description: Current source-linked thumbnail metadata, including not requested or unavailable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoThumbnail'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [Previews]
      operationId: requestVideoThumbnail
      summary: Ensure a cached video thumbnail
      description: >-
        Queues bounded frame extraction for a current retained video reference. Concurrent requests share work;
        a ready thumbnail is reused. A failed extraction can be explicitly retried. A retained HTTP(S) thumbnail
        supplied in XMPP file metadata is preferred (at most 1 MiB). Otherwise background extraction reads at most
        4 MiB from the beginning and 1 MiB from the end, with a 15 second job deadline, and never retains an original
        video. Small source videos may fit entirely within that budget. The source is revalidated before publication.
        Does not send messages or start playback. Missing both a supplied thumbnail and decoder capability returns 503 without provider retrieval.
      responses:
        '200':
          description: Thumbnail already retained
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoThumbnail'
        '202':
          description: Thumbnail extraction queued or in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoThumbnail'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/shared-content/{itemId}/content:
    get:
      tags: [SharedContent]
      operationId: getSharedContentMedia
      summary: Stream an explicitly selected video or supported document reference
      description: >-
        Reads the current retained canonical source before opening its URL through the engine's
        public-network policy. Never redirects the browser to the provider. Supports one byte
        range and If-Range; an upstream that ignores Range returns 200 rather than an invented 206.
        Video accepts MP4, WebM, Ogg video and QuickTime MIME types up to 2 GiB; codec playback
        remains a browser capability. Document references are restricted by URL extension and
        provider MIME: .txt/.log/.md/.csv/.json/.xml are served as text/plain up to 2 MiB and .pdf
        as application/pdf up to 100 MiB. Text MIME must be text/plain or the matching format's
        text/markdown, text/csv, application/json, text/json, application/xml or text/xml.
        HTML, SVG, office documents and mismatched MIME types are unsupported. A known complete
        size is required. This is explicit on-demand streaming, not a retained download: no
        full-file hash, sender verification, offline availability or transfer state is implied.
        Listing/mounting UI must not call this operation. Client disconnect cancels the upstream
        read. HEAD returns 405 without contacting the provider. Multiple or malformed ranges
        are invalid. JSON, XML and Markdown are returned as plain text, never active markup.
      parameters:
      - name: itemId
        in: path
        required: true
        description: Current supported catalog item UUID, never an arbitrary provider URL.
        schema:
          $ref: '#/components/schemas/ID'
      - name: Range
        in: header
        description: One bytes range, including an open-ended or suffix range.
        schema:
          type: string
          maxLength: 256
      - name: If-Range
        in: header
        description: A strong entity tag or HTTP date previously returned for this resource. Ignored without Range.
        schema:
          type: string
          maxLength: 1024
      responses:
        '200':
          description: Complete media/document response; the provider may have ignored Range.
          headers:
            Accept-Ranges:
              description: Byte-range capability for this source.
              schema:
                type: string
                enum: [bytes, none]
            Content-Disposition:
              description: Inline content with a sanitized retained source filename.
              schema:
                type: string
            Content-Length:
              description: Exact response byte count.
              schema:
                type: integer
                format: int64
                minimum: 0
            Content-Range:
              description: Validated bytes start-end/total for a partial response; absent for 200.
              schema:
                type: string
            ETag:
              description: Sanitized provider entity validator, not a computed or verified digest.
              schema:
                type: string
            Last-Modified:
              description: Validated provider HTTP date when supplied.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
            video/ogg:
              schema:
                type: string
                format: binary
            video/quicktime:
              schema:
                type: string
                format: binary
        '206':
          description: Validated partial media/document response.
          headers:
            Accept-Ranges:
              description: Byte-range capability for this source.
              schema:
                type: string
                enum: [bytes, none]
            Content-Disposition:
              description: Inline content with a sanitized retained source filename.
              schema:
                type: string
            Content-Length:
              description: Exact response byte count.
              schema:
                type: integer
                format: int64
                minimum: 0
            Content-Range:
              description: Validated bytes start-end/total for a partial response; absent for 200.
              schema:
                type: string
            ETag:
              description: Sanitized provider entity validator, not a computed or verified digest.
              schema:
                type: string
            Last-Modified:
              description: Validated provider HTTP date when supplied.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
            video/ogg:
              schema:
                type: string
                format: binary
            video/quicktime:
              schema:
                type: string
                format: binary
        '400':
          description: Malformed or multiple byte ranges, invalid validators, or invalid identity.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The current retained supported reference does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405':
          description: Only GET is supported; no provider request occurs.
          headers:
            Allow:
              description: GET is the only supported method.
              schema:
                type: string
                enum: [GET]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: The complete source exceeds its type-specific streaming limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: The provider MIME type does not match the retained supported reference.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '416':
          description: Requested range cannot be satisfied.
          headers:
            Content-Range:
              description: bytes */total when the complete source size is known.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The provider destination is blocked by the public-network policy.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Provider response or range metadata is invalid, unavailable, or truncated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Streaming is unavailable or the bounded concurrent-reader limit is reached.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: The provider read timed out.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/conversations/{conversationId}/messages/{messageId}/context:
    parameters:
    - $ref: '#/components/parameters/ConversationID'
    - $ref: '#/components/parameters/MessageID'
    get:
      operationId: getMessageContext
      tags: [Messages]
      summary: Read a bounded timeline around a retained message
      description: Reads the target and nearest retained neighbors from the same conversation, newest first by
        original UTC timestamp at millisecond precision and UUID tie-break. Includes the target even with limit 1.
        Only local retained data is read; no provider archive queries or read receipts are triggered. Foreign or
        unavailable source messages return not_found. Clients should offer return to latest when hasNewer is true.
        A retained correction-source alias resolves to the original logical targetId with requestedTargetId
        identifying the requested alias. All returned items remain scoped to this conversation.
      parameters:
      - name: limit
        in: query
        description: Maximum window size, including the target.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Retained context window including the target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageContext'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/messages/{messageId}/star:
    parameters:
    - $ref: '#/components/parameters/MessageID'
    get:
      operationId: getMessageStar
      tags: [Messages]
      summary: Read the source message star
      description: App-owned state independent of message content revisions and protocol support. Before the first
        change, starred is false and revisionId and updatedAt are null. Reading does not create state or provider traffic.
      responses:
        '200':
          description: Current star state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageStar'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: setMessageStar
      tags: [Messages]
      summary: Star or unstar a retained source message
      description: Atomically compares the star revision, stores an independent immutable star revision, a durable
        operation receipt and an event. Does not edit message content, bump chat activity, change read state or send
        anything to the provider. The precondition is null for unchanged initial state. A stale precondition returns
        state_conflict with currentStar. Replays return the original receipt snapshot, even if later changes occurred;
        read current state after an uncertain response. An already matching value records a receipt without a new event.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Stable UUID for this exact star operation, retained across retries.
        schema:
          $ref: '#/components/schemas/ID'
      requestBody:
        required: true
        description: Desired state and the previously observed star revision.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMessageStar'
      responses:
        '200':
          description: Committed star state or original operation snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageStar'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/conversations/{conversationId}/read-state:
    parameters:
    - $ref: '#/components/parameters/ConversationID'
    get:
      operationId: getConversationReadState
      tags: [Conversations]
      summary: Read retained conversation read state
      description: Reads app-owned read state without changing messages or sending provider receipts.
      responses:
        '200':
          description: Current read state and unread count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationReadState'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: markConversationMessagesRead
      tags: [Conversations]
      summary: Mark specifically observed incoming messages read
      description: Atomically merges the listed retained message identities into app-owned read state. Other
        messages, including later arrivals, remain unread. Lists are bounded and must belong to this conversation.
        Own and historical messages are ignored. Repeated batches are safe; retries with the same key return the
        original committed snapshot. Read revisions and operation receipts are durable. Reading does not bump
        conversation activity, edit content or send protocol receipts. This alpha operation records local engine
        read evidence; receipt emission and independent-engine synchronization remain deferred.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Stable UUID for this exact read batch, reused after an uncertain response.
        schema:
          $ref: '#/components/schemas/ID'
      requestBody:
        required: true
        description: Message identities observed in the active focused conversation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkMessagesRead'
      responses:
        '200':
          description: Committed read state or original operation snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationReadState'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/conversations/{conversationId}/message-stars:
    parameters:
    - $ref: '#/components/parameters/ConversationID'
    get:
      operationId: listConversationMessageStars
      tags: [Messages]
      summary: Read star states for displayed messages
      description: Reads up to 100 distinct source message states without creating rows. Every message must belong
        to the requested conversation; foreign or missing message IDs reject the whole request. Item order is unspecified.
      parameters:
      - name: messageId
        in: query
        required: true
        example: [019a5df0-0000-7000-8000-000000000001]
        description: Source message UUIDs to read, one query parameter per UUID.
        style: form
        explode: true
        schema:
          type: array
          example: [019a5df0-0000-7000-8000-000000000001]
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ID'
      responses:
        '200':
          description: Current states, including explicit false and null revisions for untouched messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageStarPage'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/starred-messages:
    get:
      operationId: listStarredMessages
      tags: [Messages]
      summary: Browse retained starred messages with their source context
      description: Lists current starred messages across accounts or within an account/conversation. Order is source
        message UTC timestamp at millisecond precision descending, then message UUID descending. Unstarring a cursor message does not break paging.
        This is a live collection, not a frozen snapshot; newer stars can appear before the current page. No provider
        requests, enrichment or downloads are started. Conversation favorites are independent of message stars.
      parameters:
      - name: accountId
        in: query
        description: Optional owning account filter.
        schema:
          $ref: '#/components/schemas/ID'
      - name: conversationId
        in: query
        description: Optional source conversation filter; it must agree with accountId when both are supplied.
        schema:
          $ref: '#/components/schemas/ID'
      - name: cursor
        in: query
        description: Message UUID from nextCursor; its retained source message must belong to the selected scope.
        schema:
          $ref: '#/components/schemas/ID'
      - name: limit
        in: query
        description: Maximum number of starred messages per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Current starred-message page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StarredMessagePage'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/conversations/{conversationId}/previews:
    get:
      tags:
      - Previews
      operationId: listConversationPreviews
      summary: Read cached message link and image previews
      description: Returns at most three URL previews per retained message. Without messageId, uses the latest fifty
        messages. Cache misses queue bounded background page metadata enrichment. Original images are fetched only
        by the explicit download operation. Message text and revisions are unchanged.
      parameters:
      - name: conversationId
        in: path
        required: true
        description: Stable entity UUID.
        schema: &id001
          $ref: '#/components/schemas/ID'
      - name: messageId
        in: query
        required: false
        description: Message UUIDs from this conversation, up to one hundred. Omit for the latest fifty messages.
        style: form
        explode: true
        schema:
          type: array
          maxItems: 100
          minItems: 1
          uniqueItems: true
          example:
          - 019a5df0-0000-7000-8000-000000000001
          items: *id001
      responses:
        '200':
          description: Cached structured previews, including queued or unavailable metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewPage'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/previews/{previewId}:
    get:
      tags:
      - Previews
      operationId: getMessagePreview
      summary: Read a message preview
      description: Reads cached metadata and original image download state. Does not initiate a download.
      parameters:
      - name: previewId
        in: path
        required: true
        description: Stable entity UUID.
        schema: *id001
      responses:
        '200':
          description: Current preview state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePreview'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/previews/{previewId}/refresh:
    post:
      tags: [Previews]
      operationId: refreshMessagePreview
      summary: Refresh cached link metadata
      description: >-
        Explicitly queues fresh metadata for a current retained link reference,
        bypassing the metadata cache. Existing metadata remains usable during
        refresh or failure. Concurrent pending refreshes share queued work.
        Does not edit a message or request an original image download.
      parameters:
      - name: previewId
        in: path
        required: true
        description: Stable preview entity UUID.
        schema: *id001
      responses:
        '202':
          description: Refresh queued with existing metadata preserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePreview'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/previews/{previewId}/download:
    post:
      tags:
      - Previews
      operationId: downloadPreviewImage
      summary: Retain the original image for a preview
      description: 'Explicitly requests the original for a kind=image reference. This ensure operation is safe to
        retry: concurrent requests share queued work and an already retained file is reused. Failed downloads can
        be retried. Only validated PNG, JPEG and GIF images up to 32 MiB and bounded pixel dimensions are retained.
        The local SHA-256 fingerprint is computed-only, not evidence of sender-provided integrity. Link cards do not
        support this operation.'
      parameters:
      - name: previewId
        in: path
        required: true
        description: Stable entity UUID.
        schema: *id001
      responses:
        '200':
          description: Original already retained
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePreview'
        '202':
          description: Download queued or in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePreview'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/media/{hash}:
    get:
      tags:
      - Previews
      operationId: getMediaImage
      summary: Read a retained preview or original image
      description: Serves only local hash-verified PNG, JPEG or GIF bytes, without fetching the provider. Thumbnails
        are normalized static PNGs or JPEGs, up to 1024 pixels per axis; originals retain their validated media type. No remote redirects.
      parameters:
      - name: hash
        in: path
        required: true
        description: Lowercase SHA-256 digest of the retained file.
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
      - name: If-None-Match
        in: header
        required: false
        description: Previously returned image ETag.
        schema:
          type: string
          maxLength: 1024
      responses:
        '200':
          description: Retained image bytes. Content-Type identifies PNG, JPEG or GIF.
          headers:
            ETag:
              description: Quoted content digest.
              schema:
                type: string
            Cache-Control:
              description: Private immutable cache policy.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '304':
          description: Matching ETag; no response body.
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/health:
    get:
      tags:
      - System
      operationId: getHealth
      summary: Check engine readiness
      description: Returns ready only when the database can be queried.
      responses:
        '200':
          description: Engine ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ready
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/engine:
    get:
      tags:
      - System
      operationId: getEngine
      summary: Read the persistent engine identity
      description: Read eventCursor before fetching snapshots to replay changes during the snapshot.
      responses:
        '200':
          description: Engine identity and current event boundary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Engine'
              example:
                id: 019a5df0-0000-7000-8000-000000000003
                role: local
                apiVersion: 0.12.0
                eventCursor: 019a5df0-0000-7000-8000-000000000003:1
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/accounts:
    get:
      tags:
      - Accounts
      operationId: listAccounts
      summary: List registered account metadata
      description: Stable UUID-ordered keyset pagination; registration does not establish an XMPP session.
      parameters:
      - name: after
        in: query
        description: Continue after this account UUID.
        schema:
          $ref: '#/components/schemas/ID'
      - name: limit
        in: query
        description: Maximum page size.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: A page of accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
              example:
                items:
                - id: 019a5df0-0000-7000-8000-000000000001
                  revisionId: 019a5df0-0000-7000-8000-000000000002
                  protocol: xmpp
                  address: alice@localhost
                  label: Personal
                  connectionState: not_connected
                  createdAt: '2026-11-07T12:00:00Z'
        '400':
          $ref: '#/components/responses/Invalid'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags:
      - Accounts
      operationId: registerAccount
      summary: Register protocol account metadata
      description: 'Atomically stores an account, initial immutable revision, operation receipt,

        and account.registered event. Repeating a key with the same normalized input

        returns the original result. Reusing it with different input conflicts.

        No credentials are accepted, and no protocol session is opened.

        New XMPP registrations use the compiled-in adapter to normalize bare JIDs before matching. Existing foundation metadata is retained without rewriting identities.

        '
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Caller-generated UUIDv7, retained for the lifetime of the engine data.
        schema:
          $ref: '#/components/schemas/ID'
      requestBody:
        description: Metadata for an existing protocol identity.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAccount'
            example:
              protocol: xmpp
              address: alice@localhost
              label: Personal
      responses:
        '201':
          description: Account registered
          headers:
            Location:
              description: Account API resource.
              schema:
                type: string
            Idempotency-Replayed:
              description: False for the first successful execution.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                id: 019a5df0-0000-7000-8000-000000000001
                revisionId: 019a5df0-0000-7000-8000-000000000002
                protocol: xmpp
                address: alice@localhost
                label: Personal
                connectionState: not_connected
                createdAt: '2026-11-07T12:00:00Z'
        '200':
          description: Original account result replayed without another side effect
          headers:
            Idempotency-Replayed:
              description: True for a repeated successful operation.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                id: 019a5df0-0000-7000-8000-000000000001
                revisionId: 019a5df0-0000-7000-8000-000000000002
                protocol: xmpp
                address: alice@localhost
                label: Personal
                connectionState: not_connected
                createdAt: '2026-11-07T12:00:00Z'
        '400':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/accounts/{accountId}:
    parameters:
    - $ref: '#/components/parameters/AccountID'
    get:
      tags:
      - Accounts
      operationId: getAccount
      summary: Read an account
      description: Returns registered metadata and its initial current revision.
      responses:
        '200':
          description: Registered account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                id: 019a5df0-0000-7000-8000-000000000001
                revisionId: 019a5df0-0000-7000-8000-000000000002
                protocol: xmpp
                address: alice@localhost
                label: Personal
                connectionState: not_connected
                createdAt: '2026-11-07T12:00:00Z'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/accounts/{accountId}/avatars:
    parameters:
    - $ref: '#/components/parameters/AccountID'
    get:
      operationId: listAccountAvatars
      tags: [Accounts]
      summary: Read retained profile image metadata
      description: Account-scoped user and conversation profile images retrieved through the protocol. Initials remain
        the fallback for absent or inaccessible images. Image bytes live outside SQLite and contain only normalized PNG thumbnails.
      parameters:
      - name: after
        in: query
        description: Continue after this avatar record UUID.
        schema:
          $ref: '#/components/schemas/ID'
      - name: limit
        in: query
        description: Maximum page size.
        schema: {type: integer, minimum: 1, maximum: 100, default: 100}
      responses:
        '200':
          description: Known profile metadata, ordered by stable avatar UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarPage'
              example: {items: []}
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/avatars/{hash}:
    parameters:
    - name: hash
      in: path
      required: true
      description: SHA-256 of the normalized PNG thumbnail.
      schema: {type: string, pattern: '^[0-9a-f]{64}$'}
    get:
      operationId: getAvatarImage
      tags: [Accounts]
      summary: Read a cached profile thumbnail
      description: Returns only a locally retained, decoded and normalized image; never redirects to provider URLs.
        Hash-addressed images can be cached privately and immutably.
      parameters:
      - name: If-None-Match
        in: header
        description: Previously received content ETag.
        schema: {type: string}
      responses:
        '200':
          description: Static PNG thumbnail, at most 256 pixels on either axis
          headers:
            ETag:
              description: Quoted content hash.
              schema: {type: string}
            Cache-Control:
              description: Private immutable cache policy.
              schema: {type: string}
          content:
            image/png:
              schema: {type: string, format: binary}
        '304':
          description: The supplied ETag still identifies this retained image
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/accounts/{accountId}/history:
    parameters:
    - $ref: '#/components/parameters/AccountID'
    get:
      operationId: getAccountHistory
      tags:
      - Accounts
      summary: Read account history recovery progress
      description: Recovery starts on protocol connection. Saved room entries and authorized text archives are read serially,
        with persistent checkpoints and deduplication. Historical imports do not create sends or unread counts.
        Complete means the last authorized text recovery pass finished; it is not a full protocol-feature claim.
        Saved rooms are read-only in this increment. Provider permission failures remain partial coverage.
      responses:
        '200':
          description: Persistent recovery state and retained counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryStatus'
              example:
                accountId: 019a5df0-0000-7000-8000-000000000001
                state: not_started
                retainedMessages: 0
                conversations: 0
                updatedAt: '2026-11-07T12:00:00Z'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/accounts/{accountId}/capabilities:
    parameters:
    - $ref: '#/components/parameters/AccountID'
    get:
      tags:
      - Accounts
      operationId: getAccountCapabilities
      summary: Read account capability evidence
      description: >-
        Read application implementation, protocol support and cached server discovery
        evidence separately. This query never contacts the protocol server. Evidence is
        scoped, bounded and cleared when a connection ends. An absent advertisement
        does not prove that a client-level feature is unsupported. Discovery runs once
        per connection; room evidence is also collected during history recovery.
      responses:
        '200':
          description: Current account capability evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
              example:
                accountId: 019a5df0-0000-7000-8000-000000000001
                state: unknown
                reason: not_connected
                features: []
                discovery:
                  state: not_connected
                  services: []
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/operations/{operationId}:
    get:
      tags:
      - Operations
      operationId: getOperation
      summary: Reconcile a mutation after an ambiguous response
      description: A receipt proves the local mutation committed; send receipts prove durable engine acceptance,
        never recipient delivery. Unknown IDs return 404.
      parameters:
      - name: operationId
        in: path
        required: true
        description: The original Idempotency-Key.
        schema:
          $ref: '#/components/schemas/ID'
      responses:
        '200':
          description: Durable operation receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              example:
                id: 019a5df0-0000-7000-8000-000000000004
                kind: register_account
                status: succeeded
                resourceId: 019a5df0-0000-7000-8000-000000000001
                createdAt: '2026-11-07T12:00:00Z'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/events:
    get:
      tags:
      - Events
      operationId: streamEvents
      x-sse-event-schema:
        $ref: '#/components/schemas/Event'
      summary: Replay durable changes and follow new events
      description: 'SSE id is engineUUID:sequence; event is the event type; data is Event JSON.

        Last-Event-ID resumes strictly after its sequence. Without a cursor replay

        from zero. Cursors from another engine or ahead of current state return 409

        before streaming. Heartbeat comments are not durable events.

        This engine retains the complete change log. Clients deduplicate by event

        ID and refresh snapshots if a future retention policy expires a cursor.

        '
      parameters:
      - name: Last-Event-ID
        in: header
        description: Previously applied engine-scoped cursor.
        schema:
          type: string
          maxLength: 64
      responses:
        '200':
          description: SSE stream whose data fields follow the Event schema
          content:
            text/event-stream:
              schema:
                type: string
              example: ': heartbeat


                '
        '400':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/accounts/{accountId}/connection:
    parameters:
    - $ref: '#/components/parameters/AccountID'
    get:
      operationId: getAccountConnection
      tags:
      - Accounts
      summary: Read account connection state
      description: State is runtime evidence, distinct from saved account metadata.
      responses:
        '200':
          description: Current resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
              example:
                accountId: 019a5df0-0000-7000-8000-000000000001
                state: not_connected
                updatedAt: '2026-11-07T12:00:00Z'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: configureAccountConnection
      tags:
      - Accounts
      summary: Configure and connect an account
      description: Persists write-only credentials before starting an asynchronous TLS/SASL connection. Transient
        network failures reconnect with bounded backoff; invalid credentials or TLS verification failures require
        corrected configuration. Ordinary engine restart reloads enabled configurations.
      responses:
        '202':
          description: Connection configuration accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
              example:
                accountId: 019a5df0-0000-7000-8000-000000000001
                state: not_connected
                updatedAt: '2026-11-07T12:00:00Z'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        description: Structured operation input.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureConnection'
            example:
              password: alice-local-only
    delete:
      operationId: disconnectAccount
      tags:
      - Accounts
      summary: Disconnect and disable automatic connection
      description: Keeps protocol credentials local for a later explicit configuration; does not delete account
        history or pending sends. Repeating disconnect is safe.
      responses:
        '200':
          description: Current resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
              example:
                accountId: 019a5df0-0000-7000-8000-000000000001
                state: not_connected
                updatedAt: '2026-11-07T12:00:00Z'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/conversations:
    get:
      operationId: listConversations
      tags:
      - Conversations
      summary: List retained conversations
      description: Keyset pages ordered by descending engine activity. Search matches conversation address/title
        and latest text preview; this is not full message search.
      responses:
        '200':
          description: Current resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
              example:
                items: []
        '400':
          $ref: '#/components/responses/Invalid'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: cursor
        in: query
        description: Opaque nextCursor from the preceding page.
        schema:
          type: string
          maxLength: 100
      - name: limit
        in: query
        description: Maximum page size.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: accountId
        in: query
        required: false
        description: Stable accountId reference.
        schema:
          $ref: '#/components/schemas/ID'
      - name: q
        in: query
        description: Conversation address/title/latest-preview substring.
        schema:
          type: string
          maxLength: 200
      - name: unreadOnly
        in: query
        description: Only conversations with unread messages.
        schema:
          type: boolean
      - name: favoritesOnly
        in: query
        description: Only favorite conversations.
        schema:
          type: boolean
      - name: archived
        in: query
        description: Archived state; defaults to false.
        schema:
          type: boolean
      - name: kind
        in: query
        description: Conversation kind.
        schema:
          type: string
          enum:
          - direct
          - room
    post:
      operationId: openConversation
      tags:
      - Conversations
      summary: Open a direct conversation
      description: Finds an existing conversation for the canonical account/peer or creates one. Durable operation
        keys retain original results. Does not add a contact or send presence subscriptions.
      responses:
        '201':
          description: Direct conversation opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
              example:
                id: 019a5df0-0000-7000-8000-000000000001
                revisionId: 019a5df0-0000-7000-8000-000000000001
                accountId: 019a5df0-0000-7000-8000-000000000001
                kind: direct
                address: bob@localhost
                title: bob@localhost
                lastMessage: Hello from Oie!
                updatedAt: '2026-11-07T12:00:00Z'
                unreadCount: 0
                archived: false
                favorite: false
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '200':
          description: Existing conversation or original operation replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
              example:
                id: 019a5df0-0000-7000-8000-000000000001
                revisionId: 019a5df0-0000-7000-8000-000000000001
                accountId: 019a5df0-0000-7000-8000-000000000001
                kind: direct
                address: bob@localhost
                title: bob@localhost
                lastMessage: Hello from Oie!
                updatedAt: '2026-11-07T12:00:00Z'
                unreadCount: 0
                archived: false
                favorite: false
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Stable Idempotency-Key reference.
        schema:
          $ref: '#/components/schemas/ID'
      requestBody:
        required: true
        description: Structured operation input.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenConversation'
            example:
              accountId: 019a5df0-0000-7000-8000-000000000001
              address: bob@localhost
  /api/v1/conversations/{conversationId}/room-session:
    parameters:
    - $ref: '#/components/parameters/ConversationID'
    get:
      operationId: getRoomSession
      tags: [Conversations]
      summary: Read this engine's room session and durable join intent
      description: Reads local state without joining. Active denotes a durable intent to rejoin, not observed membership. A joined state requires confirmed self-presence. Missing room intent has no intent identifiers.
      responses:
        '200':
          description: Current own room-session projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomSession'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: joinRoom
      tags: [Conversations]
      summary: Explicitly request entry and reconnect recovery for a saved room
      description: Durably records the owning engine's join intent before protocol work. This increment supports rooms without a join password. Repeated operation keys do not repeat an established command; changed payloads or stale intent revisions conflict. Reads and reply preparation never join. Protocol confirmation is observed through getRoomSession.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Stable operation UUID for this join intent.
        schema:
          $ref: '#/components/schemas/ID'
      requestBody:
        required: true
        description: Desired nickname and observed join-intent revision.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRoom'
      responses:
        '200':
          description: Join intent durably accepted or replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomSession'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/conversations/{conversationId}/room-session/leave:
    parameters:
    - $ref: '#/components/parameters/ConversationID'
    post:
      operationId: leaveRoom
      tags: [Conversations]
      summary: Leave a room and stop this engine's automatic rejoin
      description: Durably records an explicit leave before sending unavailable presence. Saved history and queued messages are retained. Queued room work cannot dispatch while the intent is inactive. An old operation replay never reactivates a later leave or revoked intent.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Stable operation UUID for this leave intent.
        schema:
          $ref: '#/components/schemas/ID'
      requestBody:
        required: true
        description: Observed join-intent revision.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRoom'
      responses:
        '200':
          description: Leave intent durably accepted or replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomSession'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/conversations/{conversationId}/mention-candidates:
    parameters:
    - $ref: '#/components/parameters/ConversationID'
    get:
      tags: [Conversations]
      operationId: getMentionCandidates
      summary: Read observed room mention candidates
      description: >-
        Read a bounded, account-scoped snapshot of visible room occupants. This
        never joins a room or discovers hidden personal identities. Candidates
        supply exact readable insertion text. Structured references are available
        only when the protocol adapter has a valid disclosed target; otherwise
        sending preserves the same readable text without protocol metadata.
      responses:
        '200':
          description: Available room candidates and explicit observation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentionCandidates'
              example: {conversationId: '019a5df0-0000-7000-8000-000000000001', accountId: '019a5df0-0000-7000-8000-000000000002', state: known, items: [{id: 'room@conference.example/Juliet', displayName: Juliet, insertText: '@Juliet', referenceMode: text}], truncated: false}
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/conversations/{conversationId}/details:
    parameters:
    - $ref: '#/components/parameters/ConversationID'
    get:
      tags: [Conversations]
      operationId: getConversationDetails
      summary: Read scoped conversation details
      description: >-
        Read the current account connection and session-local conversation metadata.
        Returns immediately; a connected adapter may schedule a deduplicated,
        serialized discovery refresh no more often than once per sixty seconds.
        This never joins a room, requests a subscription, probes a peer or sends a
        message. Occupant discovery is a bounded snapshot, never a complete member
        roster. Missing presence remains unknown. Disconnect clears observations.
      responses:
        '200':
          description: Available metadata and explicit field availability for this conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetails'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/conversations/{conversationId}:
    parameters:
    - $ref: '#/components/parameters/ConversationID'
    get:
      operationId: getConversation
      tags:
      - Conversations
      summary: Read a conversation
      description: Returns the current conversation projection.
      responses:
        '200':
          description: Current resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
              example:
                id: 019a5df0-0000-7000-8000-000000000001
                revisionId: 019a5df0-0000-7000-8000-000000000001
                accountId: 019a5df0-0000-7000-8000-000000000001
                kind: direct
                address: bob@localhost
                title: bob@localhost
                lastMessage: Hello from Oie!
                updatedAt: '2026-11-07T12:00:00Z'
                unreadCount: 0
                archived: false
                favorite: false
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateConversationPreferences
      tags: [Conversations]
      summary: Change retained conversation archive or favorite preferences
      description: >-
        Atomically updates only the supplied app-owned flags, records an immutable
        conversation revision and operation receipt, and emits conversation.updated
        only for an actual change. No protocol operation is performed. The owning
        account must match accountId. expectedRevisionId must match the latest
        conversation revision, including intervening incoming-message or read updates.
        A matching Idempotency-Key replays its original accepted snapshot before
        checking current state. Reusing a key with different fields or preconditions
        conflicts. Setting an already-current value succeeds without another revision
        or event. Activity order, message timestamps, unread counts and outbox are
        unchanged. Read the conversation after a replay for current state.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Durable key bound to this exact preference change and precondition.
        schema:
          $ref: '#/components/schemas/ID'
      requestBody:
        required: true
        description: Owning account, current revision and the flags to change.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationPreferences'
            example:
              accountId: 019a5df0-0000-7000-8000-000000000001
              expectedRevisionId: 019a5df0-0000-7000-8000-000000000002
              archived: true
      responses:
        '200':
          description: Accepted conversation snapshot, or its original idempotent replay
          headers:
            Idempotency-Replayed:
              description: True only when this exact operation was already accepted; the body is its original snapshot.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
              example:
                id: 019a5df0-0000-7000-8000-000000000001
                revisionId: 019a5df0-0000-7000-8000-000000000002
                accountId: 019a5df0-0000-7000-8000-000000000003
                kind: direct
                address: bob@localhost
                title: Bob
                lastMessage: Retained message
                updatedAt: '2026-11-07T12:00:00Z'
                unreadCount: 0
                archived: true
                favorite: false
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/conversations/{conversationId}/messages:
    parameters:
    - $ref: '#/components/parameters/ConversationID'
    get:
      operationId: listMessages
      tags:
      - Messages
      summary: Read retained messages
      description: Returns a bounded page of retained text newest-first by original UTC timestamp at millisecond
        precision, with a UUID tie-break. Includes serially recovered archive messages. The default direction is older;
        without a cursor it reads the latest page. Newer requires a cursor and reads the nearest messages after that
        retained conversation-scoped anchor, without skipping to the latest page. Both directions return newest-first.
        nextCursor continues in the requested direction. Reads never fetch provider history or mark messages as read.
      responses:
        '200':
          description: Current resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
              example:
                items: []
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: cursor
        in: query
        description: Retained message UUID anchoring this conversation-scoped page. Excludes the anchor. Use the oldest returned item for older and the newest returned item for newer. Required for newer.
        schema:
          $ref: '#/components/schemas/ID'
      - name: direction
        in: query
        description: Chronological direction from the retained cursor. Newer requires a cursor.
        schema:
          type: string
          enum: [older, newer]
          default: older
      - name: limit
        in: query
        description: Maximum page size.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    post:
      operationId: sendMessage
      tags:
      - Messages
      summary: Accept an immediate text message
      description: Atomically stores the message, operation receipt, and transactional outbox intent. Queued work
        survives restart and waits for connectivity. No artificial send delay. Dispatch claims race atomically with
        cancellation. Replays return the original acceptance snapshot; read the message for current state. Ambiguous
        transmission becomes unknown, never a blind retry.
      responses:
        '202':
          description: Message and send intent committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                id: 019a5df0-0000-7000-8000-000000000001
                revisionId: 019a5df0-0000-7000-8000-000000000001
                accountId: 019a5df0-0000-7000-8000-000000000001
                conversationId: 019a5df0-0000-7000-8000-000000000001
                sender:
                  id: 019a5df0-0000-7000-8000-000000000001
                  displayName: bob@localhost
                originalText: Hello from Oie!
                createdAt: '2026-11-07T12:00:00Z'
                isOwn: false
                sendState: received
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '200':
          description: Original acceptance replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                id: 019a5df0-0000-7000-8000-000000000001
                revisionId: 019a5df0-0000-7000-8000-000000000001
                accountId: 019a5df0-0000-7000-8000-000000000001
                conversationId: 019a5df0-0000-7000-8000-000000000001
                sender:
                  id: 019a5df0-0000-7000-8000-000000000001
                  displayName: bob@localhost
                originalText: Hello from Oie!
                createdAt: '2026-11-07T12:00:00Z'
                isOwn: false
                sendState: received
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Stable Idempotency-Key reference.
        schema:
          $ref: '#/components/schemas/ID'
      requestBody:
        required: true
        description: Structured operation input.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessage'
            example:
              originalText: Hello from Oie!
  /api/v1/messages/{messageId}:
    parameters:
    - $ref: '#/components/parameters/MessageID'
    get:
      operationId: getMessage
      tags:
      - Messages
      summary: Read a retained message
      description: Returns the latest revision and send evidence. A retained correction-source alias resolves
        to its canonical logical message, whose id can differ from the requested messageId. Use the scoped
        context operation when explicit requestedTargetId alias proof is needed.
      responses:
        '200':
          description: Current resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                id: 019a5df0-0000-7000-8000-000000000001
                revisionId: 019a5df0-0000-7000-8000-000000000001
                accountId: 019a5df0-0000-7000-8000-000000000001
                conversationId: 019a5df0-0000-7000-8000-000000000001
                sender:
                  id: 019a5df0-0000-7000-8000-000000000001
                  displayName: bob@localhost
                originalText: Hello from Oie!
                createdAt: '2026-11-07T12:00:00Z'
                isOwn: false
                sendState: received
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/messages/{messageId}/cancel:
    parameters:
    - $ref: '#/components/parameters/MessageID'
    post:
      operationId: cancelMessage
      tags:
      - Messages
      summary: Cancel a queued send
      description: Requires the current revision and queued state. Once dispatch starts, returns 409 with currentMessage
        and makes no change. Cancelled intents never resume on ordinary restart.
      responses:
        '200':
          description: Current resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                id: 019a5df0-0000-7000-8000-000000000001
                revisionId: 019a5df0-0000-7000-8000-000000000001
                accountId: 019a5df0-0000-7000-8000-000000000001
                conversationId: 019a5df0-0000-7000-8000-000000000001
                sender:
                  id: 019a5df0-0000-7000-8000-000000000001
                  displayName: bob@localhost
                originalText: Hello from Oie!
                createdAt: '2026-11-07T12:00:00Z'
                isOwn: false
                sendState: received
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Stable Idempotency-Key reference.
        schema:
          $ref: '#/components/schemas/ID'
      requestBody:
        required: true
        description: Structured operation input.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelMessage'
            example:
              expectedRevisionId: 019a5df0-0000-7000-8000-000000000001
components:
  parameters:
    AccountID:
      name: accountId
      in: path
      required: true
      description: Stable account UUIDv7.
      schema:
        $ref: '#/components/schemas/ID'
    ConversationID:
      name: conversationId
      in: path
      required: true
      description: Stable conversationId UUIDv7.
      schema:
        $ref: '#/components/schemas/ID'
    MessageID:
      name: messageId
      in: path
      required: true
      description: Stable messageId UUIDv7.
      schema:
        $ref: '#/components/schemas/ID'
  responses:
    Invalid:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:oie:problem:invalid_request
            title: Bad Request
            status: 400
            code: invalid_request
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:oie:problem:not_found
            title: Not Found
            status: 404
            code: not_found
    Conflict:
      description: Idempotency conflict, duplicate address, invalid stream cursor, or message state conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:oie:problem:idempotency_conflict
            title: Conflict
            status: 409
            code: idempotency_conflict
    Unavailable:
      description: Engine persistence or protocol service temporarily unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:oie:problem:unavailable
            title: Service Unavailable
            status: 503
            code: unavailable
  schemas:
    ID:
      type: string
      format: uuid
      x-go-type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      example: 019a5df0-0000-7000-8000-000000000001
      description: Canonical lowercase UUIDv7; IDs do not establish causal order.
    NullableRevisionID:
      type: string
      format: uuid
      x-go-type: string
      nullable: true
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      example: 019a5df0-0000-7000-8000-000000000004
      description: Canonical UUIDv7 of app-owned state; null means no revision has been created.
    MarkMessagesRead:
      description: Exact message identities observed by the requesting client.
      type: object
      additionalProperties: false
      required: [messageIds]
      properties:
        messageIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          example: [019a5df0-0000-7000-8000-000000000004]
          items:
            $ref: '#/components/schemas/ID'
      example:
        messageIds: [019a5df0-0000-7000-8000-000000000004]
    ConversationReadState:
      description: Durable app-owned read revision with the current retained unread count.
      type: object
      additionalProperties: false
      required: [conversationId, accountId, revisionId, updatedAt, unreadCount]
      properties:
        conversationId:
          $ref: '#/components/schemas/ID'
        accountId:
          $ref: '#/components/schemas/ID'
        revisionId:
          $ref: '#/components/schemas/NullableRevisionID'
        updatedAt:
          type: string
          format: date-time
          nullable: true
        unreadCount:
          type: integer
          minimum: 0
      example:
        conversationId: 019a5df0-0000-7000-8000-000000000003
        accountId: 019a5df0-0000-7000-8000-000000000002
        revisionId: null
        updatedAt: null
        unreadCount: 3
    MessageStar:
      type: object
      description: App-owned source message star, keyed by messageId with its own revision history. Never a message edit.
      additionalProperties: false
      required: [messageId, accountId, conversationId, revisionId, starred, updatedAt]
      properties:
        messageId:
          $ref: '#/components/schemas/ID'
        accountId:
          $ref: '#/components/schemas/ID'
        conversationId:
          $ref: '#/components/schemas/ID'
        revisionId:
          $ref: '#/components/schemas/NullableRevisionID'
        starred:
          type: boolean
          example: true
          description: Whether the owner starred the source message, independently of any attachment.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-11-08T12:00:00Z'
          description: UTC timestamp of the latest star change, null before the first change.
      example:
        messageId: 019a5df0-0000-7000-8000-000000000001
        accountId: 019a5df0-0000-7000-8000-000000000002
        conversationId: 019a5df0-0000-7000-8000-000000000003
        revisionId: null
        starred: false
        updatedAt: null
    SetMessageStar:
      type: object
      description: Desired star state and mandatory optimistic precondition; use a new operation UUID for a new decision.
      additionalProperties: false
      required: [starred, expectedRevisionId]
      properties:
        starred:
          type: boolean
          description: Desired value, never an ambiguous toggle.
        expectedRevisionId:
          $ref: '#/components/schemas/NullableRevisionID'
      example:
        starred: true
        expectedRevisionId: null
    MessageStarPage:
      type: object
      example: {"items":[{"messageId":"019a5df0-0000-7000-8000-000000000001","accountId":"019a5df0-0000-7000-8000-000000000002","conversationId":"019a5df0-0000-7000-8000-000000000003","revisionId":null,"starred":false,"updatedAt":null}]}
      description: Bounded states for the requested source message UUIDs, including untouched initial state.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MessageStar'
    StarredMessage:
      type: object
      example: {"message":{"id":"019a5df0-0000-7000-8000-000000000001","revisionId":"019a5df0-0000-7000-8000-000000000001","accountId":"019a5df0-0000-7000-8000-000000000001","conversationId":"019a5df0-0000-7000-8000-000000000001","sender":{"id":"019a5df0-0000-7000-8000-000000000001","displayName":"bob@localhost"},"originalText":"Hello from Oie!","createdAt":"2026-11-07T12:00:00Z","isOwn":false,"sendState":"received"},"conversation":{"id":"019a5df0-0000-7000-8000-000000000001","revisionId":"019a5df0-0000-7000-8000-000000000001","accountId":"019a5df0-0000-7000-8000-000000000001","kind":"direct","address":"bob@localhost","title":"bob@localhost","lastMessage":"Hello from Oie!","updatedAt":"2026-11-07T12:00:00Z","unreadCount":0,"archived":false,"favorite":false},"star":{"messageId":"019a5df0-0000-7000-8000-000000000001","accountId":"019a5df0-0000-7000-8000-000000000002","conversationId":"019a5df0-0000-7000-8000-000000000003","revisionId":"019a5df0-0000-7000-8000-000000000004","starred":true,"updatedAt":"2026-11-08T12:00:00Z"}}
      description: Latest source message and conversation projections with their independent star state.
      additionalProperties: false
      required: [message, conversation, star]
      properties:
        message:
          $ref: '#/components/schemas/Message'
        conversation:
          $ref: '#/components/schemas/Conversation'
        star:
          $ref: '#/components/schemas/MessageStar'
    StarredMessagePage:
      type: object
      example: {"items":[{"message":{"id":"019a5df0-0000-7000-8000-000000000001","revisionId":"019a5df0-0000-7000-8000-000000000001","accountId":"019a5df0-0000-7000-8000-000000000001","conversationId":"019a5df0-0000-7000-8000-000000000001","sender":{"id":"019a5df0-0000-7000-8000-000000000001","displayName":"bob@localhost"},"originalText":"Hello from Oie!","createdAt":"2026-11-07T12:00:00Z","isOwn":false,"sendState":"received"},"conversation":{"id":"019a5df0-0000-7000-8000-000000000001","revisionId":"019a5df0-0000-7000-8000-000000000001","accountId":"019a5df0-0000-7000-8000-000000000001","kind":"direct","address":"bob@localhost","title":"bob@localhost","lastMessage":"Hello from Oie!","updatedAt":"2026-11-07T12:00:00Z","unreadCount":0,"archived":false,"favorite":false},"star":{"messageId":"019a5df0-0000-7000-8000-000000000001","accountId":"019a5df0-0000-7000-8000-000000000002","conversationId":"019a5df0-0000-7000-8000-000000000003","revisionId":"019a5df0-0000-7000-8000-000000000004","starred":true,"updatedAt":"2026-11-08T12:00:00Z"}}]}
      description: Chronologically paginated current starred messages. Newly starred records can appear on earlier pages.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StarredMessage'
        nextCursor:
          $ref: '#/components/schemas/ID'
    Health:
      type: object
      description: Readiness of the engine store.
      example:
        status: ready
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ready
          example: ready
    Engine:
      type: object
      description: Persistent engine identity and event boundary.
      example:
        id: 019a5df0-0000-7000-8000-000000000003
        role: local
        apiVersion: 0.12.0
        eventCursor: 019a5df0-0000-7000-8000-000000000003:1
      additionalProperties: false
      required:
      - id
      - role
      - apiVersion
      - eventCursor
      properties:
        id:
          $ref: '#/components/schemas/ID'
        role:
          type: string
          enum:
          - local
          - hosted
        apiVersion:
          type: string
          enum:
          - 0.11.0
          - 0.12.0
        eventCursor:
          type: string
          description: Application stream boundary, separate from provider history cursors.
    RegisterAccount:
      type: object
      description: Account metadata registration, without protocol credentials.
      example:
        protocol: xmpp
        address: alice@localhost
        label: Personal
      additionalProperties: false
      required:
      - protocol
      - address
      - label
      properties:
        protocol:
          type: string
          enum:
          - xmpp
        address:
          type: string
          minLength: 1
          maxLength: 1023
        label:
          type: string
          minLength: 1
          maxLength: 120
    Account:
      type: object
      description: Stable account identity and its current initial revision.
      example:
        id: 019a5df0-0000-7000-8000-000000000001
        revisionId: 019a5df0-0000-7000-8000-000000000002
        protocol: xmpp
        address: alice@localhost
        label: Personal
        connectionState: not_connected
        createdAt: '2026-11-07T12:00:00Z'
      additionalProperties: false
      required:
      - id
      - revisionId
      - protocol
      - address
      - label
      - connectionState
      - createdAt
      properties:
        id:
          $ref: '#/components/schemas/ID'
        revisionId:
          $ref: '#/components/schemas/ID'
        protocol:
          type: string
          enum:
          - xmpp
        address:
          type: string
        label:
          type: string
        connectionState:
          type: string
          enum:
          - not_connected
          - connecting
          - connected
          - error
        createdAt:
          type: string
          format: date-time
    AccountPage:
      type: object
      description: A keyset-paginated account collection.
      example:
        items:
        - id: 019a5df0-0000-7000-8000-000000000001
          revisionId: 019a5df0-0000-7000-8000-000000000002
          protocol: xmpp
          address: alice@localhost
          label: Personal
          connectionState: not_connected
          createdAt: '2026-11-07T12:00:00Z'
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        nextCursor:
          $ref: '#/components/schemas/ID'
    Capabilities:
      type: object
      description: Implementation and discovered feature evidence scoped to one account.
      example:
        accountId: 019a5df0-0000-7000-8000-000000000001
        state: unknown
        reason: not_connected
        features: []
        discovery:
          state: not_connected
          services: []
      additionalProperties: false
      required:
      - accountId
      - state
      - reason
      - features
      - discovery
      properties:
        accountId:
          $ref: '#/components/schemas/ID'
        state:
          type: string
          enum:
          - unknown
          - known
        reason:
          type: string
          enum:
          - not_connected
          - adapter_connected
        features:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/CapabilityFeature'
          description: Stable app feature rows. These diagnostics never authorize an operation.
        discovery:
          $ref: '#/components/schemas/CapabilityDiscovery'
        directText:
          type: boolean
          description: True only while the basic direct-text adapter is connected. No other optional protocol support
            is implied.
    SupportState:
      type: string
      enum: [supported, partial, unsupported, unknown, not_required, scope_dependent, not_advertised]
      description: >-
        App unsupported means not implemented. Protocol supported means defined by
        that protocol, independently of Oie implementation. Server supported means
        observed advertised evidence. not_advertised means the relevant successful
        query omitted that feature, not a definitive operational denial.
        scope_dependent needs peer or room evidence. Unknown is never treated as false.
    CapabilityFeature:
      description: One feature compared across Oie implementation, protocol definition and scoped server evidence.
      type: object
      additionalProperties: false
      required: [id, appSupport, protocolSupport, serverSupport, scope]
      properties:
        id:
          type: string
          enum: [direct_text, account_history, saved_rooms, room_history, room_discovery, room_messaging, file_upload, image_previews, link_previews, received_replies, send_replies, mentions, edit_messages, retract_messages, reactions, read_receipts, typing, presence, profile_images, formatting, e2ee, message_stars, message_search, schedules, sync]
        appSupport:
          $ref: '#/components/schemas/SupportState'
        protocolSupport:
          $ref: '#/components/schemas/SupportState'
        serverSupport:
          $ref: '#/components/schemas/SupportState'
        scope:
          type: string
          enum: [local, account, server, service, peer, room]
    CapabilityDiscovery:
      description: Session-local discovery status and the bounded entity observations collected so far.
      type: object
      additionalProperties: false
      required: [state, services]
      properties:
        state:
          type: string
          enum: [not_connected, pending, complete, partial, failed]
        checkedAt:
          type: string
          format: date-time
          description: UTC observation time, absent before an attempt completes.
        services:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/DiscoveredService'
          description: >-
            Bounded discovered entities, not a complete server inventory. Service
            discovery skips item nodes and foreign account domains. Room evidence
            comes only from authorized saved-room history discovery. No room join.
    DiscoveredService:
      description: A validated entity response with advertised namespaces, identities and observation state.
      type: object
      additionalProperties: false
      required: [address, scope, state, features, identities, truncated]
      properties:
        address:
          type: string
          maxLength: 1024
        scope:
          type: string
          enum: [account, server, service, room]
        state:
          type: string
          enum: [known, failed]
        features:
          type: array
          maxItems: 256
          items:
            type: string
            maxLength: 1024
        identities:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [category, type]
            properties:
              category:
                type: string
                maxLength: 300
              type:
                type: string
                maxLength: 300
              name:
                type: string
                maxLength: 300
        truncated:
          type: boolean
          description: Bounded or invalid evidence was omitted; absent features remain unknown.
        errorCode:
          type: string
          enum: [discovery_failed]
    Operation:
      type: object
      description: Durable receipt used to reconcile repeated mutations.
      example:
        id: 019a5df0-0000-7000-8000-000000000004
        kind: register_account
        status: succeeded
        resourceId: 019a5df0-0000-7000-8000-000000000001
        createdAt: '2026-11-07T12:00:00Z'
      additionalProperties: false
      required:
      - id
      - kind
      - status
      - resourceId
      - createdAt
      properties:
        id:
          $ref: '#/components/schemas/ID'
        kind:
          type: string
          enum:
          - register_account
          - open_conversation
          - update_conversation_preferences
          - mark_messages_read
          - send_message
          - cancel_message
          - set_message_star
          - join_room
          - leave_room
        status:
          type: string
          enum:
          - succeeded
        resourceId:
          $ref: '#/components/schemas/ID'
        createdAt:
          type: string
          format: date-time
    Event:
      type: object
      description: Durable event with the payload corresponding to its type. Accounts, connections, conversations,
        and messages are separate payloads. Payloads are snapshots at the event time. Refresh affected retained
        pages after message or conversation updates; validated corrections can collapse previously separate source
        UUIDs into one logical message. Historical event snapshots do not replace the current canonical projection.
        No credentials or raw protocol errors are included.
      example:
        id: 019a5df0-0000-7000-8000-000000000003:1
        type: account.registered
        occurredAt: '2026-11-07T12:00:00Z'
        account:
          id: 019a5df0-0000-7000-8000-000000000001
          revisionId: 019a5df0-0000-7000-8000-000000000002
          protocol: xmpp
          address: alice@localhost
          label: Personal
          connectionState: not_connected
          createdAt: '2026-11-07T12:00:00Z'
      additionalProperties: false
      required:
      - id
      - type
      - occurredAt
      properties:
        id:
          type: string
          description: Engine-scoped durable event cursor.
        type:
          type: string
          enum:
          - account.registered
          - account.connection_changed
          - account.history_changed
          - profile.avatar_changed
          - message.preview_changed
          - message.star_changed
          - conversation.created
          - conversation.updated
          - conversation.room_session_changed
          - message.created
          - message.updated
        occurredAt:
          type: string
          format: date-time
        account:
          $ref: '#/components/schemas/Account'
        conversation:
          $ref: '#/components/schemas/Conversation'
        message:
          $ref: '#/components/schemas/Message'
        connection:
          $ref: '#/components/schemas/Connection'
        history:
          $ref: '#/components/schemas/HistoryStatus'
        avatar:
          $ref: '#/components/schemas/Avatar'
        star:
          $ref: '#/components/schemas/MessageStar'
        preview:
          $ref: '#/components/schemas/MessagePreview'
        roomSession:
          $ref: '#/components/schemas/RoomSession'
    Problem:
      type: object
      example:
        type: urn:oie:problem:unavailable
        title: Service Unavailable
        status: 503
        code: unavailable
      additionalProperties: false
      description: Stable codes for presentation-owned localization; no raw storage errors or credentials.
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
          - invalid_request
          - not_found
          - idempotency_conflict
          - account_exists
          - invalid_cursor
          - unavailable
          - state_conflict
          - protocol_unavailable
          - media_blocked
          - media_fetch_failed
          - media_too_large
          - media_unsupported
          - range_not_satisfiable
          - media_busy
          - media_timeout
        currentConversation:
          $ref: '#/components/schemas/Conversation'
        currentStar:
          $ref: '#/components/schemas/MessageStar'
        currentMessage:
          $ref: '#/components/schemas/Message'
        currentRoomSession:
          $ref: '#/components/schemas/RoomSession'
    Connection:
      type: object
      description: Current owning-engine connection state. Contains no credentials.
      additionalProperties: false
      required:
      - accountId
      - state
      - updatedAt
      properties:
        accountId:
          $ref: '#/components/schemas/ID'
        state:
          type: string
          description: Runtime connection state.
          enum:
          - not_connected
          - connecting
          - connected
          - error
        updatedAt:
          type: string
          format: date-time
          description: UTC timestamp.
        lastErrorCode:
          type: string
          description: Stable localized-error key; raw provider errors are never returned.
          enum:
          - authentication_failed
          - tls_failed
          - connection_failed
      example:
        accountId: 019a5df0-0000-7000-8000-000000000001
        state: not_connected
        updatedAt: '2026-11-07T12:00:00Z'
    MessagePreview:
      type: object
      description: Source-linked cached metadata. Entity UUID remains stable as enrichment/download revisions change.
        An absent imageHash means no local thumbnail is available. Image references without a thumbnail require explicit
        original download before preview/expansion.
      additionalProperties: false
      required:
      - id
      - revisionId
      - accountId
      - conversationId
      - messageId
      - url
      - kind
      - state
      - downloadState
      - updatedAt
      properties:
        id: &id001
          $ref: '#/components/schemas/ID'
        revisionId: *id001
        accountId: *id001
        conversationId: *id001
        messageId: *id001
        url:
          type: string
          format: uri
          maxLength: 4096
          description: Original public HTTP or HTTPS message URL. Never use this as a browser image source.
        kind:
          type: string
          enum:
          - link
          - image
        state:
          type: string
          enum:
          - queued
          - ready
          - unavailable
        downloadState:
          type: string
          enum:
          - not_downloaded
          - queued
          - downloading
          - ready
          - failed
        updatedAt:
          type: string
          format: date-time
        title:
          type: string
          maxLength: 300
          description: Plain page title or image filename.
        description:
          type: string
          maxLength: 1000
          description: Plain page description.
        siteName:
          type: string
          maxLength: 200
          description: Plain publisher name or hostname.
        lastErrorCode:
          type: string
          maxLength: 40
          description: Stable failure code for localization, without provider error details.
        imageHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Local static PNG or JPEG thumbnail digest, sized for high-DPI message cards.
        faviconHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Optional locally cached and normalized site icon. Never a provider URL.
        fileHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Retained original image digest, computed after complete download.
        fileMimeType:
          type: string
          enum:
          - image/png
          - image/jpeg
          - image/gif
        fileSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 33554432
        integrity:
          type: string
          enum:
          - computed_only
          description: No expected sender digest was supplied for this URL reference.
      example: &id002
        id: 019a5df0-0000-7000-8000-000000000001
        revisionId: 019a5df0-0000-7000-8000-000000000001
        accountId: 019a5df0-0000-7000-8000-000000000001
        conversationId: 019a5df0-0000-7000-8000-000000000001
        messageId: 019a5df0-0000-7000-8000-000000000001
        url: https://example.com/article
        kind: link
        state: ready
        downloadState: not_downloaded
        title: Shared article
        siteName: Example
        updatedAt: '2026-11-08T12:00:00Z'
    VideoThumbnail:
      type: object
      description: Cached frame metadata for one canonical retained video reference. A ready imageHash is a normalized static thumbnail; original video bytes are never retained by this operation.
      additionalProperties: false
      required: [id, revisionId, sharedContentId, accountId, conversationId, messageId, url, kind, state, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        revisionId:
          $ref: '#/components/schemas/ID'
        sharedContentId:
          $ref: '#/components/schemas/ID'
        accountId:
          $ref: '#/components/schemas/ID'
        conversationId:
          $ref: '#/components/schemas/ID'
        messageId:
          $ref: '#/components/schemas/ID'
        url:
          type: string
          format: uri
          maxLength: 4096
          description: Retained source reference for identity checks, never an image source.
          example: https://files.example/clip.mp4
        kind:
          type: string
          enum: [video]
          example: video
        state:
          type: string
          enum: [not_requested, queued, ready, unavailable]
          example: queued
        updatedAt:
          type: string
          format: date-time
          example: '2026-11-08T12:00:00Z'
        imageHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Local normalized PNG or JPEG digest for a ready thumbnail.
          example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        lastErrorCode:
          type: string
          maxLength: 40
          description: Stable failure key. Failed extraction is retried only on explicit request.
          example: frame_unavailable
    Contact:
      type: object
      description: A retained protocol roster entry, separate from inferred peers, room occupants and future app-owned identity linking.
      additionalProperties: false
      required: [id, revisionId, accountId, accountLabel, address, displayName, groups, subscription]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        revisionId:
          $ref: '#/components/schemas/ID'
        accountId:
          $ref: '#/components/schemas/ID'
        accountLabel:
          type: string
          description: Current label of the owning account.
        address:
          type: string
          description: Canonical protocol contact address.
        displayName:
          type: string
          description: Saved provider roster name, or address when no name was supplied.
        groups:
          type: array
          description: Provider roster categories, not chat-room membership.
          items:
            type: string
        subscription:
          type: string
          description: Provider-observed presence subscription, without changing it.
          enum: [none, to, from, both]
        conversationId:
          $ref: '#/components/schemas/ID'
    ContactSource:
      type: object
      description: Last observed roster coverage for one account. A known snapshot remains cached when disconnected.
      additionalProperties: false
      required: [accountId, state]
      properties:
        accountId:
          $ref: '#/components/schemas/ID'
        state:
          type: string
          description: Unknown before a successful observation; unavailable after a failed refresh, preserving cached entries.
          enum: [unknown, known, unavailable]
        checkedAt:
          type: string
          format: date-time
          description: UTC time of the last successful complete roster observation.
    ContactPage:
      type: object
      description: Bounded saved contact results and observation coverage.
      additionalProperties: false
      required: [items, sources]
      example:
        items: []
        sources: []
      properties:
        items:
          type: array
          description: Matching contacts in stable UUID order.
          maxItems: 100
          items:
            $ref: '#/components/schemas/Contact'
        nextCursor:
          type: string
          maxLength: 512
          description: Opaque next matching page, absent at the end.
        sources:
          type: array
          description: Observation status of accounts in the requested scope.
          items:
            $ref: '#/components/schemas/ContactSource'
    MessageSearchHit:
      type: object
      description: A matching current or verified earlier content revision with current canonical navigation context. Multiple hits for one message occur only with explicit edit history.
      additionalProperties: false
      required: [message, accountLabel, conversationTitle, matchedRevisionId, matchedAt, historical, matchKind, excerpt]
      properties:
        message:
          $ref: '#/components/schemas/Message'
        accountLabel:
          type: string
          description: Current owning account label.
        conversationTitle:
          type: string
          description: Current source conversation title.
        matchedRevisionId:
          $ref: '#/components/schemas/ID'
        matchedAt:
          type: string
          format: date-time
          description: UTC creation time of the retained matching content revision.
        historical:
          type: boolean
          description: True only for an earlier content revision. Independent of message.historical, which describes archive provenance. Message always contains current canonical content; use its id for navigation.
        matchKind:
          type: string
          description: Whether retained text or current associated metadata supplied the match.
          enum: [text, metadata]
        excerpt:
          type: string
          maxLength: 512
          description: Bounded plain text from matching content or metadata. Never HTML; clients must escape it. Earlier content is represented here, rather than by the current message text.
    MessageSearchPage:
      type: object
      description: Retained message search results. Message text is immediate; metadata indexing coverage is reported separately.
      additionalProperties: false
      required: [query, includeEditHistory, items, metadataIndexing]
      example:
        query: software livre
        includeEditHistory: false
        items: []
        metadataIndexing:
          state: complete
          indexedMessages: 0
          totalMessages: 0
      properties:
        query:
          type: string
          maxLength: 200
          description: Search query after trimming surrounding whitespace.
        accountId:
          $ref: '#/components/schemas/ID'
        conversationId:
          $ref: '#/components/schemas/ID'
        includeEditHistory:
          type: boolean
          description: Applied earlier-content filter.
        items:
          type: array
          maxItems: 100
          description: Current and explicitly requested historical hits in stable chronological keyset order.
          items:
            $ref: '#/components/schemas/MessageSearchHit'
        nextCursor:
          type: string
          maxLength: 2048
          description: Opaque cursor for the next matching page, absent at the end.
        metadataIndexing:
          $ref: '#/components/schemas/SharedContentIndexing'
    SharedContentItem:
      type: object
      description: One shared URL reference with its exact retained source message and current owning labels.
      additionalProperties: false
      required: [id, revisionId, kind, url, fileName, accountLabel, conversationTitle, message]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        revisionId:
          $ref: '#/components/schemas/ID'
        kind:
          type: string
          enum: [image, video, audio, link, document]
        url:
          type: string
          format: uri
          maxLength: 4096
          description: Original HTTP/HTTPS reference. Never use as an automatic browser media source.
        fileName:
          type: string
          maxLength: 300
        accountLabel:
          type: string
        conversationTitle:
          type: string
        message:
          $ref: '#/components/schemas/Message'
        preview:
          $ref: '#/components/schemas/MessagePreview'
        thumbnail:
          $ref: '#/components/schemas/VideoThumbnail'
    SharedContentIndexing:
      type: object
      description: Local source-message indexing progress, scoped by account/conversation but independent of tab/search.
      additionalProperties: false
      required: [state, indexedMessages, totalMessages]
      properties:
        state:
          type: string
          enum: [pending, complete]
        indexedMessages:
          type: integer
          format: int64
          minimum: 0
        totalMessages:
          type: integer
          format: int64
          minimum: 0
    SharedContentPage:
      type: object
      description: Bounded shared-content page. Image previews and originals retain their independent hashes and states.
      additionalProperties: false
      required: [items, indexing]
      example:
        items: []
        indexing:
          state: pending
          indexedMessages: 0
          totalMessages: 100
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SharedContentItem'
        nextCursor:
          type: string
          maxLength: 512
        indexing:
          $ref: '#/components/schemas/SharedContentIndexing'
    PreviewPage:
      type: object
      description: At most three preview references for each selected retained message, up to three hundred items.
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 300
          items:
            $ref: '#/components/schemas/MessagePreview'
      example:
        items:
        - *id002
    Avatar:
      type: object
      additionalProperties: false
      description: Retained profile image projection, scoped to an account and canonical protocol address.
        Empty imageHash means the provider explicitly returned no image. Provider errors keep the last known image.
      required: [id, revisionId, accountId, address, imageHash, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ID'
        revisionId:
          $ref: '#/components/schemas/ID'
        accountId:
          $ref: '#/components/schemas/ID'
        address:
          type: string
          description: Canonical account or conversation address; callers treat it as an opaque identity key.
        imageHash:
          type: string
          description: Empty for no image, otherwise SHA-256 of the normalized PNG; use getAvatarImage to retrieve it.
          pattern: '^([0-9a-f]{64})?$'
        updatedAt:
          type: string
          format: date-time
      example:
        id: 019a5df0-0000-7000-8000-000000000001
        revisionId: 019a5df0-0000-7000-8000-000000000002
        accountId: 019a5df0-0000-7000-8000-000000000003
        address: bob@localhost
        imageHash: ''
        updatedAt: '2026-11-07T12:00:00Z'
    AvatarPage:
      type: object
      additionalProperties: false
      description: Account-scoped profile metadata page.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Avatar'
        nextCursor:
          $ref: '#/components/schemas/ID'
      example: {items: []}
    HistoryStatus:
      type: object
      additionalProperties: false
      description: Last history recovery pass; counts describe this engine's retained records, not total provider history.
      required: [accountId, state, retainedMessages, conversations, updatedAt]
      properties:
        accountId:
          $ref: '#/components/schemas/ID'
        state:
          type: string
          enum: [not_started, syncing, complete, partial, unsupported, error]
        retainedMessages:
          type: integer
          minimum: 0
        conversations:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        lastErrorCode:
          type: string
          enum: [discovery_failed, archive_failed, unstable_archive]
      example:
        accountId: 019a5df0-0000-7000-8000-000000000001
        state: syncing
        retainedMessages: 50
        conversations: 3
        updatedAt: '2026-11-07T12:00:00Z'
    ConfigureConnection:
      type: object
      description: Desired enabled connection. Repeating unchanged configuration does not create another session.
        Credentials are kept in private engine-local files and are excluded from reads/events.
      additionalProperties: false
      required:
      - password
      properties:
        password:
          type: string
          description: Protocol password; never returned.
          minLength: 1
          maxLength: 4096
          writeOnly: true
        endpoint:
          type: string
          description: Optional TCP host:port override. TLS verifies the account domain. Omit to use XMPP SRV discovery.
          maxLength: 255
      example:
        password: alice-local-only
    OpenConversation:
      type: object
      description: Open or find a direct conversation in a registered account.
      additionalProperties: false
      required:
      - accountId
      - address
      properties:
        accountId:
          $ref: '#/components/schemas/ID'
        address:
          type: string
          description: Destination protocol address, normalized by the owning adapter.
          minLength: 1
          maxLength: 1023
      example:
        accountId: 019a5df0-0000-7000-8000-000000000001
        address: bob@localhost
    UpdateConversationPreferences:
      type: object
      description: Field-isolated archive or favorite change with a current conversation revision precondition. At least one flag is required; omitted flags remain unchanged and null values are invalid.
      additionalProperties: false
      minProperties: 3
      required: [accountId, expectedRevisionId]
      properties:
        accountId:
          allOf:
          - $ref: '#/components/schemas/ID'
          description: Owning account assertion; a different account is rejected without changing the conversation.
        expectedRevisionId:
          allOf:
          - $ref: '#/components/schemas/ID'
          description: Exact current conversation revision. A stale revision yields state_conflict with currentConversation.
        archived:
          type: boolean
          description: Desired archive state. Incoming messages never automatically unarchive a conversation.
        favorite:
          type: boolean
          description: Desired conversation favorite state, separate from source-message stars.
      example:
        accountId: 019a5df0-0000-7000-8000-000000000001
        expectedRevisionId: 019a5df0-0000-7000-8000-000000000002
        favorite: true
    Conversation:
      type: object
      description: One account-scoped conversation. Direct conversations support text sending; saved rooms and authorized room archives are recovered read-only in this increment.
      additionalProperties: false
      required:
      - id
      - revisionId
      - accountId
      - kind
      - address
      - title
      - lastMessage
      - updatedAt
      - unreadCount
      - archived
      - favorite
      properties:
        id:
          $ref: '#/components/schemas/ID'
        revisionId:
          $ref: '#/components/schemas/ID'
        accountId:
          $ref: '#/components/schemas/ID'
        kind:
          type: string
          description: Conversation kind.
          enum:
          - direct
          - room
        address:
          type: string
          description: Canonical peer address.
        title:
          type: string
          description: Display title; initially the peer address.
        lastMessage:
          type: string
          description: Original text preview of the most recently retained message.
        updatedAt:
          type: string
          format: date-time
          description: UTC timestamp.
        unreadCount:
          type: integer
          minimum: 0
        archived:
          type: boolean
        favorite:
          type: boolean
      example:
        id: 019a5df0-0000-7000-8000-000000000001
        revisionId: 019a5df0-0000-7000-8000-000000000001
        accountId: 019a5df0-0000-7000-8000-000000000001
        kind: direct
        address: bob@localhost
        title: bob@localhost
        lastMessage: Hello from Oie!
        updatedAt: '2026-11-07T12:00:00Z'
        unreadCount: 0
        archived: false
        favorite: false
    DetailState:
      type: string
      description: Observation state; unavailable or missing information never means an empty room or an offline person.
      enum: [unknown, pending, known, partial, forbidden, unavailable, not_connected, unsupported]
    PresenceObservation:
      type: object
      description: Observed presence from authorized traffic, without active probes or inferred offline state.
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [unknown, available, away, busy, extended_away, chat, unavailable]
        statusText:
          type: string
          maxLength: 300
        observedAt:
          type: string
          format: date-time
          description: UTC time this presence was observed, absent for unknown presence.
    ConversationParticipant:
      type: object
      description: A scoped peer or room-occupant observation; its identifier is not a verified personal identity.
      additionalProperties: false
      required: [id, displayName, source, presence]
      properties:
        id:
          type: string
          maxLength: 1024
          description: Opaque identifier scoped to this account and conversation. Never use a nickname as a profile identity.
        displayName:
          type: string
          maxLength: 300
        source:
          type: string
          enum: [discovery, presence]
        presence:
          $ref: '#/components/schemas/PresenceObservation'
    ConversationParticipants:
      type: object
      description: Bounded peer or visible-occupant snapshot; no persistent membership roster or completeness guarantee.
      additionalProperties: false
      required: [scope, state, items, truncated]
      properties:
        scope:
          type: string
          enum: [peer, occupants]
        state:
          $ref: '#/components/schemas/DetailState'
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ConversationParticipant'
        truncated:
          type: boolean
        checkedAt:
          type: string
          format: date-time
    ConversationDetails:
      type: object
      description: Session-local conversation observations combined with the owning account connection, without changing retained conversation content.
      example:
        conversationId: 019a5df0-0000-7000-8000-000000000001
        accountId: 019a5df0-0000-7000-8000-000000000002
        kind: room
        address: room@conference.example.test
        state: pending
        accountConnection:
          accountId: 019a5df0-0000-7000-8000-000000000002
          state: connected
          updatedAt: '2026-11-08T12:00:00Z'
        roomSession: not_joined
        features: []
        participants:
          scope: occupants
          state: pending
          items: []
          truncated: false
      additionalProperties: false
      required: [conversationId, accountId, kind, address, state, accountConnection, features, participants]
      properties:
        conversationId:
          $ref: '#/components/schemas/ID'
        accountId:
          $ref: '#/components/schemas/ID'
        kind:
          type: string
          enum: [direct, room]
          example: room
        address:
          type: string
        state:
          $ref: '#/components/schemas/DetailState'
        accountConnection:
          $ref: '#/components/schemas/Connection'
        checkedAt:
          type: string
          format: date-time
        name:
          type: string
          maxLength: 300
        description:
          type: string
          maxLength: 2000
        topic:
          type: string
          maxLength: 2000
        occupantCount:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Server-reported occupancy, independent of visibility or returned list length.
        roomSession:
          type: string
          enum: [not_joined, joining, joined, failed, unknown]
        features:
          type: array
          maxItems: 16
          items:
            type: string
            enum: [public, hidden, members_only, open, persistent, temporary, moderated, unmoderated, password_protected, unsecured, anonymous, non_anonymous]
        participants:
          $ref: '#/components/schemas/ConversationParticipants'
        peerPresence:
          $ref: '#/components/schemas/PresenceObservation'
    ConversationPage:
      type: object
      description: Conversations in descending engine activity order. New activity can move items between pages;
        reconcile using stable IDs and SSE.
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        nextCursor:
          type: string
          description: Opaque engine-scoped activity cursor.
      example:
        items: []
    Sender:
      type: object
      description: Engine-local source identity. For recovered room messages, this is the room-scoped source with an observed speaker nickname, not a verified personal identity.
      additionalProperties: false
      required:
      - id
      - displayName
      properties:
        id:
          $ref: '#/components/schemas/ID'
        displayName:
          type: string
          description: Display name, initially a protocol address.
      example:
        id: 019a5df0-0000-7000-8000-000000000001
        displayName: bob@localhost
    MessageReply:
      type: object
      description: A protocol-identified reply projection. It never infers identity from quoted text. Available
        means exactly one retained target in the same account and conversation matches the validated protocol reference.
        Unavailable references may retain a bounded compatibility excerpt, but cannot be navigated.
      additionalProperties: false
      required: [available, bodyText, excerpt]
      properties:
        available:
          type: boolean
          example: true
          description: Whether a unique retained original is available for navigation.
        messageId:
          $ref: '#/components/schemas/ID'
        senderName:
          type: string
          maxLength: 300
          description: Observed original sender display name, not proof of a real-world identity.
          example: Bob
        excerpt:
          type: string
          maxLength: 512
          description: Plain bounded original body or protocol-marked fallback excerpt. Never provider HTML.
          example: We should bake a cake.
        bodyText:
          type: string
          description: Display body after valid protocol-marked Unicode fallback ranges are moved to the quote card.
            originalText remains unchanged for copying. Malformed or unrecognized fallback ranges remain in the body.
          example: Great idea!
      example:
        available: true
        messageId: 019a5df0-0000-7000-8000-000000000001
        senderName: Bob
        excerpt: We should bake a cake.
        bodyText: Great idea!
    MessageContext:
      type: object
      description: Bounded retained timeline window. Neighbor availability is relative to the returned extremes.
        Validated correction-source aliases resolve to the original logical message UUID returned as targetId.
        Page outward through listMessages using the oldest item UUID with direction older and the newest item UUID
        with direction newer. Neighbor flags describe availability beyond these returned extremes.
      additionalProperties: false
      required: [targetId, items, hasOlder, hasNewer]
      properties:
        targetId:
          $ref: '#/components/schemas/ID'
        requestedTargetId:
          allOf:
          - $ref: '#/components/schemas/ID'
          description: Present only when the requested retained correction-source UUID resolves to a different canonical targetId. This is an engine-validated alias within this conversation, not a client-supplied replacement target.
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Message'
        hasOlder:
          type: boolean
          example: false
        hasNewer:
          type: boolean
          example: true
      example: {"targetId":"019a5df0-0000-7000-8000-000000000001","items":[{"id":"019a5df0-0000-7000-8000-000000000001","revisionId":"019a5df0-0000-7000-8000-000000000001","accountId":"019a5df0-0000-7000-8000-000000000001","conversationId":"019a5df0-0000-7000-8000-000000000001","sender":{"id":"019a5df0-0000-7000-8000-000000000001","displayName":"bob@localhost"},"originalText":"Hello from Oie!","createdAt":"2026-11-07T12:00:00Z","isOwn":false,"sendState":"received"}],"hasOlder":false,"hasNewer":true}
    Message:
      type: object
      description: Retained original text and actual send evidence. submitted means the stanza was written to the
        authenticated stream; it does not prove provider acceptance, recipient delivery, or read state. unknown
        is not automatically resent.
      additionalProperties: false
      required:
      - id
      - revisionId
      - accountId
      - conversationId
      - sender
      - originalText
      - createdAt
      - isOwn
      - sendState
      properties:
        id:
          $ref: '#/components/schemas/ID'
        revisionId:
          $ref: '#/components/schemas/ID'
        accountId:
          $ref: '#/components/schemas/ID'
        conversationId:
          $ref: '#/components/schemas/ID'
        sender:
          $ref: '#/components/schemas/Sender'
        mentions:
          type: array
          maxItems: 32
          description: Frozen selected mentions with Unicode ranges in authored text, excluding any reply compatibility prefix.
          items:
            $ref: '#/components/schemas/MessageMention'
        reply:
          $ref: '#/components/schemas/MessageReply'
        replyToMessageId:
          allOf:
          - $ref: '#/components/schemas/ID'
          description: Canonical target UUID frozen in an outgoing reply intent, including a text-only fallback. It does not imply the original is still available. Reply bodyText preserves the authored response for receipt reconciliation.
        originalText:
          type: string
          description: Exact text of the current retained content revision. Validated incoming corrections retain the logical message UUID and original creation time; prior source bodies remain retained. Copying returns this text without removing formatting or compatibility quoting.
        createdAt:
          type: string
          format: date-time
          description: UTC timestamp.
        isOwn:
          type: boolean
        historical:
          type: boolean
          description: True for archive imports. Omitted means false. Clients must not treat these as new unread messages or fresh notifications.
        edited:
          type: boolean
          description: True when a validated protocol correction supplies the current content. Omitted means false. Send-state revisions alone do not mark a message edited.
          example: true
        editedAt:
          type: string
          format: date-time
          description: UTC source timestamp of the selected protocol correction, when edited is true. Receiving or importing an old correction does not give it a new edit timestamp.
        sendState:
          type: string
          description: Durable transport evidence.
          enum:
          - received
          - queued
          - dispatching
          - submitted
          - unknown
          - failed
          - cancelled
      example:
        id: 019a5df0-0000-7000-8000-000000000001
        revisionId: 019a5df0-0000-7000-8000-000000000001
        accountId: 019a5df0-0000-7000-8000-000000000001
        conversationId: 019a5df0-0000-7000-8000-000000000001
        sender:
          id: 019a5df0-0000-7000-8000-000000000001
          displayName: bob@localhost
        originalText: Hello from Oie!
        createdAt: '2026-11-07T12:00:00Z'
        isOwn: false
        sendState: received
    MessagePage:
      type: object
      description: Logical messages newest first by original UTC creation time and UUID tie-break. Validated
        correction sources are retained as revisions rather than additional timeline items. Use nextCursor for
        records in the requested direction; render each page in reverse for a chronological timeline. For newer pages, nextCursor is the newest returned UUID, while older pages use the oldest returned UUID.
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        nextCursor:
          $ref: '#/components/schemas/ID'
      example:
        items: []
    RoomSession:
      type: object
      additionalProperties: false
      description: Own engine's room intent and observed session, distinct from account connectivity and public occupant discovery.
      required: [accountId, conversationId, active, state, updatedAt]
      properties:
        accountId:
          $ref: '#/components/schemas/ID'
        conversationId:
          $ref: '#/components/schemas/ID'
        intentId:
          $ref: '#/components/schemas/ID'
        intentRevisionId:
          $ref: '#/components/schemas/ID'
        active:
          type: boolean
          description: This engine has a durable active join intent. False after explicit leave or revoked access.
        state:
          type: string
          enum: [not_joined, joining, joined, failed]
        nickname:
          type: string
          maxLength: 100
          description: Selected room nickname when known.
        lastErrorCode:
          type: string
          enum: [not_connected, forbidden, not_authorized, nickname_conflict, registration_required, room_unavailable, removed, timeout, unsupported, unknown]
        updatedAt:
          type: string
          format: date-time
      example:
        accountId: 019a5df0-0000-7000-8000-000000000001
        conversationId: 019a5df0-0000-7000-8000-000000000002
        active: false
        state: not_joined
        updatedAt: '2026-11-08T12:00:00Z'
    JoinRoom:
      description: Explicit room-entry command with optimistic intent revision.
      type: object
      additionalProperties: false
      required: [expectedRevisionId]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 100
          description: Optional nickname; the adapter chooses its account default when omitted. No password is accepted in this increment.
        expectedRevisionId:
          $ref: '#/components/schemas/NullableRevisionID'
      example:
        expectedRevisionId: null
    LeaveRoom:
      description: Explicit room-exit command preserving retained history and pending work.
      type: object
      additionalProperties: false
      required: [expectedRevisionId]
      properties:
        expectedRevisionId:
          $ref: '#/components/schemas/NullableRevisionID'
      example:
        expectedRevisionId: 019a5df0-0000-7000-8000-000000000003
    MentionSelection:
      type: object
      description: A user-selected, account-and-room-scoped participant with an authored Unicode text span.
      additionalProperties: false
      required: [participantId, begin, end]
      properties:
        participantId:
          type: string
          minLength: 1
          maxLength: 1024
          description: Opaque candidate identifier scoped to the sending account and room.
        begin:
          type: integer
          minimum: 0
          maximum: 16384
          description: Inclusive Unicode code-point offset in authored originalText, before a reply compatibility prefix.
        end:
          type: integer
          minimum: 1
          maximum: 16384
          description: Exclusive Unicode code-point offset. The selected span must equal the candidate insertion text.
    MessageMention:
      type: object
      description: Accepted mention selection with frozen text or structured delivery mode; protocol targets remain private to the engine.
      additionalProperties: false
      required: [participantId, begin, end, referenceMode]
      properties:
        participantId:
          type: string
          maxLength: 1024
        begin:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 1
        referenceMode:
          type: string
          enum: [text, structured]
          description: Frozen delivery mode; structured adds adapter-validated protocol metadata while retaining the text.
    MentionCandidate:
      type: object
      description: A currently observed room occupant with readable insertion text and effective reference mode.
      additionalProperties: false
      required: [id, displayName, insertText, referenceMode]
      properties:
        id:
          type: string
          maxLength: 1024
          description: Opaque account-and-room-scoped identifier, never a verified personal identity.
        displayName:
          type: string
          maxLength: 300
        insertText:
          type: string
          maxLength: 1100
          description: Exact readable text to insert, including the leading at sign.
        referenceMode:
          type: string
          enum: [text, structured]
    MentionCandidates:
      type: object
      description: Bounded visible-occupant choices without personal protocol identifiers or a completeness claim.
      additionalProperties: false
      required: [conversationId, accountId, state, items, truncated]
      properties:
        conversationId:
          $ref: '#/components/schemas/ID'
        accountId:
          $ref: '#/components/schemas/ID'
        state:
          type: string
          enum: [known, partial, unavailable, not_connected]
          example: known
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/MentionCandidate'
          example: [{id: 'room@conference.example.org/Juliet', displayName: Juliet, insertText: '@Juliet', referenceMode: text}]
        truncated:
          type: boolean
          example: false
    SendMessage:
      type: object
      description: >-
        Durably accept authored text with an optional source-message reply. The engine
        validates the retained target within the same account and conversation and
        snapshots the sender, excerpt, wire reference and compatibility quote. Clients
        submit only the target UUID, never a quoted body or protocol identifier.
        originalText in the resulting Message is the full transmitted body, including
        fallback text. Message.reply.bodyText contains the authored response. Structured
        references are emitted where valid protocol identifiers are available, with
        text fallback for legacy clients or an unavailable stable target identifier.
        Room sends require an active explicit join intent; dispatch waits for confirmed
        own membership. No room is joined by accepting or preparing a reply.
      additionalProperties: false
      required:
      - originalText
      properties:
        originalText:
          type: string
          description: Original UTF-8 text. Whitespace/newlines are preserved; empty or whitespace-only bodies are
            rejected.
          minLength: 1
          maxLength: 16384
        mentions:
          type: array
          maxItems: 32
          description: Selected room mentions in authored text. Sorted, nonoverlapping spans are part of the immutable send intent and idempotency fingerprint. The engine freezes references before enqueueing; clients cannot submit protocol URIs.
          items:
            $ref: '#/components/schemas/MentionSelection'
        replyToMessageId:
          allOf:
          - $ref: '#/components/schemas/ID'
          description: Retained source UUID in this conversation. Omitted for an ordinary message. Part of the immutable send intent and operation fingerprint.
      example:
        originalText: Hello from Oie!
    CancelMessage:
      type: object
      description: Cancel only while queued and before dispatch starts. A conflict returns currentMessage with actual
        state.
      additionalProperties: false
      required:
      - expectedRevisionId
      properties:
        expectedRevisionId:
          $ref: '#/components/schemas/ID'
      example:
        expectedRevisionId: 019a5df0-0000-7000-8000-000000000001
